syntax = "proto3";

package yandex.cloud.maintenance.v2;

import "google/protobuf/timestamp.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/maintenance/v2;maintenance";
option java_package = "yandex.cloud.api.maintenance.v2";

message Resource {
  // ID of the resource
  string id = 1;

  // The type of the resource, e.g. resource-manager.cloud, resource-manager.folder, compute.instance, etc.
  string type = 2;
}

message ChangeFreeze {
  enum Status {
    // Not set.
    STATUS_UNSPECIFIED = 0;

    // Change freeze is scheduled for a future time.
    SCHEDULED = 1;

    // Change freeze is currently active.
    ACTIVE = 2;

    // Change freeze is completed.
    COMPLETED = 3;

    // Change freeze is cancelled.
    CANCELLED = 4;
  }

  // ID of the change freeze.
  string id = 1;

  // Full path to the resource affected by the change freeze,
  // represented as a hierarchy from specific resource to top-level container.
  repeated Resource resource_path = 2;

  // The time when the change freeze is scheduled to start.
  google.protobuf.Timestamp start_at = 3;

  // The time when the change freeze is scheduled to end.
  google.protobuf.Timestamp end_at = 4;

  // Duration of the change freeze in seconds.
  int64 duration_seconds = 5;

  // Reason for the change freeze.
  string reason = 6;

  // The user who created the change freeze.
  string created_by = 7;

  // The creation time of the change freeze.
  google.protobuf.Timestamp created_at = 8;

  // Status of the change freeze.
  Status status = 9;

  // The user who last updated the change freeze.
  string updated_by = 10;

  // The time when the change freeze was last updated.
  google.protobuf.Timestamp updated_at = 11;
}

message CreateChangeFreezeRequest {
  // ID of the resource to create a change freeze for.
  string resource_id = 1 [
    (required) = true,
    (length) = "<=50"
  ];

  // The time when the change freeze should start.
  google.protobuf.Timestamp start_at = 2 [(required) = true];

  // The time when the change freeze should end.
  google.protobuf.Timestamp end_at = 3 [(required) = true];

  // Reason for the change freeze.
  string reason = 4 [(length) = "<=256"];
}

message GetChangeFreezeRequest {
  // ID of the change freeze to retrieve.
  string change_freeze_id = 1 [
    (required) = true,
    (length) = "<=50"
  ];
}

message ListChangeFreezesRequest {
  // Full path to the resource to list change freezes for.
  repeated Resource resource_path = 1 [(size) = "1-128"];

  // The maximum number of change freezes to return per response.
  int64 page_size = 2 [(value) = "<=1000"];

  // Token to retrieve the next page of results. Omitted on the first request.
  string page_token = 3 [(length) = "<=500"];

  // Filter list by various fields.
  string filter = 4 [(length) = "<=300"];
}

message ListChangeFreezesResponse {
  // List of change freezes.
  repeated ChangeFreeze change_freezes = 1;

  // Token to retrieve the next page of results.
  string next_page_token = 2;
}

message TerminateChangeFreezeRequest {
  // ID of the change freeze to terminate.
  string change_freeze_id = 1 [
    (required) = true,
    (length) = "<=50"
  ];
}

message TerminateChangeFreezeResponse {
  // The terminated change freeze.
  ChangeFreeze change_freeze = 1;

  // Number of seconds that were used before termination.
  int64 used_seconds = 2;

  // Number of seconds returned to the yearly limit after termination.
  int64 returned_seconds = 3;
}

message GetChangeFreezeLimitsRequest {
  // ID of the resource to get change freeze limits for.
  string resource_id = 1 [
    (required) = true,
    (length) = "<=50"
  ];
}

message ChangeFreezeConstraints {
  // Maximum total duration of change freezes per year, in seconds.
  int64 yearly_limit_seconds = 1;

  // Maximum duration of a single change freeze, in seconds.
  int64 max_period_seconds = 2;

  // Minimum gap between change freezes, in seconds.
  int64 min_gap_seconds = 3;

  // Maximum advance time for scheduling a change freeze, in seconds.
  int64 max_advance_seconds = 4;
}

message ChangeFreezeLimitsResponse {
  // ID of the resource.
  string resource_id = 1;

  // Constraints for change freezes.
  ChangeFreezeConstraints constraints = 2;

  // Number of seconds already used this year.
  int64 used_seconds_this_year = 3;

  // Number of seconds remaining this year.
  int64 remaining_seconds_this_year = 4;
}
