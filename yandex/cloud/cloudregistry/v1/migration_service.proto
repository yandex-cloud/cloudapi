syntax = "proto3";

package yandex.cloud.cloudregistry.v1;

import "yandex/cloud/api/operation.proto";
import "yandex/cloud/cloudregistry/v1/migration.proto";
import "yandex/cloud/operation/operation.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/cloudregistry/v1;cloudregistry";
option java_package = "yandex.cloud.api.cloudregistry.v1";

// A set of methods for managing cloud migration.
service MigrationService {
  // Starts migration for all registries in the specified cloud.
  rpc StartCloud(StartCloudMigrationRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "StartCloudMigrationMetadata"
      response: "google.protobuf.Empty"
    };
  };

  // Starts migration for all registries in the specified folder.
  rpc StartFolder(StartFolderMigrationRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "StartFolderMigrationMetadata"
      response: "google.protobuf.Empty"
    };
  };

  // Returns migration status dashboard for the specified cloud.
  rpc GetCloudMigrationStatusDashboard(GetCloudMigrationStatusDashboardRequest) returns (CloudMigrationStatusDashboard) {
  };

  // Toggles whether redirects are allowed for the specified registry.
  rpc ToggleRegistryRedirects(ToggleRegistryRedirectsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "ToggleRegistryRedirectsMetadata"
      response: "google.protobuf.Empty"
    };
  };

  // Toggles whether redirects are allowed for all registries in the specified folder.
  rpc ToggleFolderRedirects(ToggleFolderRedirectsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "ToggleFolderRedirectsMetadata"
      response: "google.protobuf.Empty"
    };
  };

  // Toggles whether redirects are allowed for all registries in the specified cloud.
  rpc ToggleCloudRedirects(ToggleCloudRedirectsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "ToggleCloudRedirectsMetadata"
      response: "google.protobuf.Empty"
    };
  };
}

// Request for starting migration for all registries in the specified cloud.
message StartCloudMigrationRequest {
  // ID of the cloud.
  string cloud_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Whether to disable redirects for registries.
  // Default value: false.
  bool disable_redirects = 2;
}

// Metadata for cloud migration operation.
message StartCloudMigrationMetadata {
  // ID of the cloud.
  string cloud_id = 1;

  // IDs of registries selected for migration.
  repeated string registry_ids = 2;
}

// Request for starting migration for all registries in the specified folder.
message StartFolderMigrationRequest {
  // ID of the folder.
  string folder_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Whether to disable redirects for registries.
  // Default value: false.
  bool disable_redirects = 2;
}

// Metadata for folder migration operation.
message StartFolderMigrationMetadata {
  // ID of the folder.
  string folder_id = 1;

  // IDs of registries selected for migration.
  repeated string registry_ids = 2;
}

// Request for getting migration status dashboard for the specified cloud.
message GetCloudMigrationStatusDashboardRequest {
  // ID of the cloud.
  string cloud_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Maximum number of failed registry dashboards to return.
  int64 failed_registries_limit = 2 [(value) = "0-100"];

  // Maximum number of in-progress registry dashboards to return.
  int64 in_progress_registries_limit = 3 [(value) = "0-100"];

  // Maximum number of failed repositories to return for each registry dashboard.
  int64 failed_repositories_limit = 4 [(value) = "0-100"];

  // Maximum number of failed tags to return for each registry dashboard.
  int64 failed_tags_limit = 5 [(value) = "0-100"];

  // Maximum number of in-progress repositories to return for each registry dashboard.
  int64 in_progress_repositories_limit = 6 [(value) = "0-100"];
}

// Migration status dashboard for the specified cloud.
message CloudMigrationStatusDashboard {
  // ID of the cloud.
  string cloud_id = 1;

  // Overall migration status of the cloud.
  MigrationStatus status = 2;

  // Migration progress counters grouped by resource type.
  CloudMigrationProgressCounters progress = 3;

  // Top registry dashboards that failed during migration.
  repeated MigrationStatusDashboard top_failed_registries = 4;

  // Top registry dashboards that are currently being migrated.
  repeated MigrationStatusDashboard top_in_progress_registries = 5;
}

// Cloud migration progress counters.
message CloudMigrationProgressCounters {
  // Registry migration counters.
  MigrationCounters registries = 1;

  // Repository migration counters.
  MigrationCounters repositories = 2;

  // Tag migration counters.
  MigrationCounters tags = 3;
}

// Request for toggling whether redirects are allowed for the specified registry.
message ToggleRegistryRedirectsRequest {
  // ID of the registry.
  string registry_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Whether redirects are allowed for the registry.
  bool enabled = 2;
}

// Metadata for the operation of toggling registry redirects behavior.
message ToggleRegistryRedirectsMetadata {
  // ID of the registry.
  string registry_id = 1;

  // Whether redirects are allowed for the registry.
  bool enabled = 2;
}

// Request for toggling whether redirects are allowed for all registries in the specified folder.
message ToggleFolderRedirectsRequest {
  // ID of the folder.
  string folder_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Whether redirects are allowed for the registries.
  bool enabled = 2;
}

// Metadata for the operation of toggling folder redirects behavior.
message ToggleFolderRedirectsMetadata {
  // ID of the folder.
  string folder_id = 1;

  // IDs of registries affected.
  repeated string registry_ids = 2;

  // Whether redirects are allowed for the registries.
  bool enabled = 3;
}

// Request for toggling whether redirects are allowed for all registries in the specified cloud.
message ToggleCloudRedirectsRequest {
  // ID of the cloud.
  string cloud_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Whether redirects are allowed for the registries.
  bool enabled = 2;
}

// Metadata for the operation of toggling cloud redirects behavior.
message ToggleCloudRedirectsMetadata {
  // ID of the cloud.
  string cloud_id = 1;

  // IDs of registries affected.
  repeated string registry_ids = 2;

  // Whether redirects are allowed for the registries.
  bool enabled = 3;
}
