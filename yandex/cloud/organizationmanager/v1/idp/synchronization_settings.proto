syntax = "proto3";

package yandex.cloud.organizationmanager.v1.idp;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/organizationmanager/v1/idp;idp";
option java_package = "yandex.cloud.api.organizationmanager.v1.idp";

// Synchronization settings for a subject container.
message SynchronizationSettings {
  // ID of the subject container.
  string subject_container_id = 1;

  // Filter configuration for synchronization.
  SynchronizationFilter filter = 2;

  // Behavior when removing users.
  RemoveUserBehavior remove_user_behavior = 3;

  // Interval between synchronization runs.
  google.protobuf.Duration synchronization_interval = 4;

  // Whether users can be captured during synchronization.
  bool allow_to_capture_users = 5;

  // Whether groups can be captured during synchronization.
  bool allow_to_capture_groups = 6;

  // User attribute mappings.
  repeated UserAttributeMapping user_attribute_mappings = 7;

  // Group attribute mappings.
  repeated GroupAttributeMapping group_attribute_mappings = 8;

  // Timestamp when the settings were created.
  google.protobuf.Timestamp created_at = 9;

  // Domain replacement configuration.
  string replacement_domain = 10;

  // Enables password writeback feature.
  bool enable_password_writeback = 11;

  // Settings for generic LDAP synchronization source.
  //
  // Empty for Active Directory source. Required and fully populated for
  // generic LDAP source.
  LdapSettings ldap_settings = 12;
}

// Settings for generic LDAP synchronization source.
message LdapSettings {
  // Name of the LDAP attribute that holds the unique entry identifier.
  string external_id_attribute = 1;

  // Name of the LDAP attribute that holds the DN of the entry.
  string dn_attribute = 2;

  // ObjectClass of users.
  string user_object_class = 3;

  // ObjectClass of groups.
  string group_object_class = 4;

  // Name of the LDAP attribute that stores the account status.
  string account_disabled_attribute = 5;

  // Value of `account_disabled_attribute` meaning the account is disabled.
  string account_disabled_value = 6;

  // Value of `account_disabled_attribute` meaning the account is enabled.
  string account_enabled_value = 7;

  // Name of the LDAP attribute the agent writes the new password to during
  // password writeback.
  string password_attribute = 8;

  // Delta synchronization mode.
  LdapDeltaSyncMode delta_sync_mode = 9;

  // Enables the AD-extension matching rule
  // 1.2.840.113556.1.4.1941 for the group-DN membership filter.
  bool use_recursive_membership_filter = 10;
}

// Delta synchronization mode for generic LDAP source.
enum LdapDeltaSyncMode {
  LDAP_DELTA_SYNC_MODE_UNSPECIFIED = 0;

  // Every run is a full sync; no replication token is used.
  LDAP_DELTA_SYNC_MODE_FULL_SYNC = 1;
}

// Filter configuration for synchronization.
message SynchronizationFilter {
  // Domain to synchronize.
  string domain = 1 [
    (length) = "1-253",
    (required) = true
  ];

  // List of groups to synchronize.
  repeated string groups = 2 [
    (length) = "1-253",
    (size) = "<=10"
  ];

  // List of organizational units to synchronize.
  repeated string organization_units = 3 [
    (length) = "1-253",
    (size) = "<=10"
  ];

  // Group attribute filter, combined with the existing group and organizational
  // unit filters using AND. If omitted, groups are not restricted by their
  // attributes. Adding, changing or removing this filter requires FULL_SYNC.
  AttributeFilter group_attributes_filter = 4;

  // User attribute filter, combined with the existing group and organizational
  // unit filters using AND. If omitted, users are not restricted by their
  // attributes. Adding, changing or removing this filter requires FULL_SYNC.
  AttributeFilter user_attributes_filter = 5;
}

// Attribute rules for one object type. Nested expressions are not supported.
message AttributeFilter {
  // Logical operator used to combine all rules.
  CombineWith combine_with = 1 [(required) = true];

  // Rules to evaluate. A configured filter must contain between 1 and 50 rules.
  repeated AttributeFilterRule rules = 2 [(size) = "1-50"];
  enum CombineWith {
    // The combination operator is not specified.
    COMBINE_WITH_UNSPECIFIED = 0;

    // All rules must match.
    AND = 1;

    // At least one rule must match.
    OR = 2;
  }
}

// A comparison against a source attribute.
//
// AD/DRSR comparisons are case-insensitive and do not trim whitespace.
// Null attributes do not match positive or negative string operators.
// For multivalued LDAP attributes, positive operators require at least one
// matching value; negative operators require a present attribute with no
// matching values.
message AttributeFilterRule {
  // Exact name of a supported AD/DRSR agent model field, or a native LDAP
  // attribute name. No aliases or name conversions are applied.
  string field = 1 [
    (length) = "1-256",
    (required) = true
  ];

  // Comparison operator.
  Operator operator = 2 [(required) = true];

  // Comparison value. An empty or omitted value means no comparison value.
  // Must be nonempty for string operators and empty for IS_NULL and IS_NOT_NULL.
  // Characters such as '*', '(' and ')' are literals, not LDAP filter or regular
  // expression syntax.
  string value = 3 [(length) = "<=512"];
  enum Operator {
    // The comparison operator is not specified.
    OPERATOR_UNSPECIFIED = 0;

    // The attribute equals the value.
    EQUALS = 1;

    // The attribute does not equal the value.
    NOT_EQUALS = 2;

    // The attribute starts with the value.
    STARTS_WITH = 3;

    // The attribute does not start with the value.
    NOT_STARTS_WITH = 4;

    // The attribute ends with the value.
    ENDS_WITH = 5;

    // The attribute does not end with the value.
    NOT_ENDS_WITH = 6;

    // The attribute contains the value.
    CONTAINS = 7;

    // The attribute does not contain the value.
    NOT_CONTAINS = 8;

    // The AD/DRSR model field is empty, or the LDAP attribute is absent.
    IS_NULL = 9;

    // The AD/DRSR model field is nonempty, or the LDAP attribute is present,
    // including an attribute with an empty value.
    IS_NOT_NULL = 10;
  }
}

// User attribute mapping configuration.
message UserAttributeMapping {
  // Source attribute name.
  string source = 1 [(length) = "0-253"];

  // Target attribute to map to.
  UserTargetAttribute target = 2 [(required) = true];

  // Type of mapping.
  MappingType type = 3 [(required) = true];
}

// Group attribute mapping configuration.
message GroupAttributeMapping {
  // Source attribute name.
  string source = 1 [(length) = "0-253"];

  // Target attribute to map to.
  GroupTargetAttribute target = 2 [(required) = true];

  // Type of mapping.
  MappingType type = 3 [(required) = true];
}

// Type of attribute mapping.
enum MappingType {
  // The mapping type is not specified.
  MAPPING_TYPE_UNSPECIFIED = 0;

  // Direct mapping from source to target.
  DIRECT = 1;

  // Empty mapping (no source attribute).
  EMPTY = 2;

  // Direct mapping from an arbitrary `source` attribute
  DIRECT_ARBITRARY_ATTRIBUTE = 3;
}

// Target attributes for user mapping.
enum UserTargetAttribute {
  // The target attribute is not specified.
  USER_TARGET_ATTRIBUTE_UNSPECIFIED = 0;

  // Full name attribute.
  FULL_NAME = 1;

  // Given name attribute.
  GIVEN_NAME = 2;

  // Family name attribute.
  FAMILY_NAME = 3;

  // Email attribute.
  EMAIL = 4;

  // Phone number attribute.
  PHONE_NUMBER = 5;

  // Username attribute.
  USERNAME = 6;

  // Company name attribute.
  COMPANY_NAME = 7;

  // Job title attribute.
  JOB_TITLE = 8;

  // Department attribute.
  DEPARTMENT = 9;

  // Employee ID attribute.
  EMPLOYEE_ID = 10;
}

// Target attributes for group mapping.
enum GroupTargetAttribute {
  // The target attribute is not specified.
  GROUP_TARGET_ATTRIBUTE_UNSPECIFIED = 0;

  // Name attribute.
  NAME = 1;

  // Description attribute.
  DESCRIPTION = 2;
}

// Behavior when removing users during synchronization.
enum RemoveUserBehavior {
  // The behavior is not specified.
  REMOVE_USER_BEHAVIOR_UNSPECIFIED = 0;

  // Remove the user.
  REMOVE = 1;

  // Block the user.
  BLOCK = 2;
}

// Type of synchronization session.
enum SessionType {
  // The session type is not specified.
  SESSION_TYPE_UNSPECIFIED = 0;

  // Active Directory synchronization session.
  AD_SYNC = 1;

  // Active Directory password hash session.
  AD_PASSWORD_HASH = 2;

  // Active Directory user control session.
  AD_USER_CONTROL = 3;

  // Generic LDAP synchronization session.
  LDAP_SYNC = 4;
}
