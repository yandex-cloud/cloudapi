syntax = "proto3";

package yandex.cloud.smartwebsecurity.v1.load_balancer;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "yandex/cloud/api/operation.proto";
import "yandex/cloud/operation/operation.proto";
import "yandex/cloud/smartwebsecurity/v1/load_balancer/load_balancer.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/smartwebsecurity/v1/load_balancer;smartwebsecurity";
option java_package = "yandex.cloud.api.smartwebsecurity.v1.load_balancer";

// A set of methods for managing Smart Web Security load balancers.
service LoadBalancerService {
  // Returns the specified load balancer.
  rpc Get(GetLoadBalancerRequest) returns (LoadBalancer) {
    option (google.api.http) = {
      get: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}"
    };
  };

  // Lists load balancers in the specified folder.
  rpc List(ListLoadBalancersRequest) returns (ListLoadBalancersResponse) {
    option (google.api.http) = {
      get: "/smartwebsecurity/v1/loadBalancers"
    };
  };

  // Creates a load balancer in the specified folder.
  rpc Create(CreateLoadBalancerRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "CreateLoadBalancerMetadata"
      response: "LoadBalancer"
    };
    option (google.api.http) = {
      body: "*"
      post: "/smartwebsecurity/v1/loadBalancers"
    };
  };

  // Updates the specified load balancer.
  rpc Update(UpdateLoadBalancerRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "UpdateLoadBalancerMetadata"
      response: "LoadBalancer"
    };
    option (google.api.http) = {
      body: "*"
      patch: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}"
    };
  };

  // Deletes the specified load balancer.
  rpc Delete(DeleteLoadBalancerRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "DeleteLoadBalancerMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}"
    };
  };

  // Starts the specified load balancer.
  rpc Start(StartLoadBalancerRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "StartLoadBalancerMetadata"
      response: "LoadBalancer"
    };
    option (google.api.http) = {
      post: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}:start"
    };
  };

  // Stops the specified load balancer.
  rpc Stop(StopLoadBalancerRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "StopLoadBalancerMetadata"
      response: "LoadBalancer"
    };
    option (google.api.http) = {
      post: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}:stop"
    };
  };

}

message GetLoadBalancerRequest {
  // ID of the load balancer to return.
  string load_balancer_id = 1 [(required) = true];
}

message ListLoadBalancersRequest {
  // ID of the folder to list load balancers in.
  string folder_id = 1 [(required) = true];
}

message ListLoadBalancersResponse {
  // List of load balancers.
  repeated LoadBalancer load_balancers = 1;
}

message CreateLoadBalancerRequest {
  reserved 11;

  // ID of the folder to create the load balancer in.
  string folder_id = 1 [(required) = true];

  // Resource labels as `key:value` pairs.
  map<string, string> labels = 2;

  // Name of the load balancer.
  string name = 3;

  // Description of the load balancer.
  string description = 4;

  // Domains served by the load balancer.
  repeated Domain domains = 5;

  // ID of the service account used to access dependent resources.
  string service_account_id = 6;

  // ID of the region where the load balancer is located.
  string region_id = 7;

  // Protects the load balancer from accidental deletion.
  bool deletion_protection = 8;

  // Cloud Logging settings.
  LogOptions log_options = 9;

  // Number of initially allocated resource units.
  int64 resource_units = 10;

  // Options that apply to all domains.
  RouteOptions route_options = 12;
}

message CreateLoadBalancerMetadata {
  // ID of the load balancer that is being created.
  string load_balancer_id = 1;
}

message UpdateLoadBalancerRequest {
  // ID of the load balancer to update.
  string load_balancer_id = 1 [(required) = true];

  // Field mask that specifies which fields of the load balancer are going to be updated.
  google.protobuf.FieldMask update_mask = 2;

  // Resource labels as `key:value` pairs.
  map<string, string> labels = 3;

  // Name of the load balancer.
  string name = 4;

  // Description of the load balancer.
  string description = 5;

  // Domains served by the load balancer.
  repeated Domain domains = 6;

  // ID of the service account used to access dependent resources.
  string service_account_id = 7;

  // Protects the load balancer from accidental deletion.
  bool deletion_protection = 8;

  // Cloud Logging settings.
  LogOptions log_options = 9;

  // Number of initially allocated resource units.
  int64 resource_units = 10;

  // Options that apply to all domains.
  RouteOptions route_options = 11;
}

message UpdateLoadBalancerMetadata {
  // ID of the load balancer that is being updated.
  string load_balancer_id = 1;
}

message DeleteLoadBalancerRequest {
  // ID of the load balancer to delete.
  string load_balancer_id = 1 [(required) = true];
}

message DeleteLoadBalancerMetadata {
  // ID of the load balancer that is being deleted.
  string load_balancer_id = 1;
}

message StartLoadBalancerRequest {
  // ID of the load balancer to start.
  string load_balancer_id = 1 [(required) = true];
}

message StartLoadBalancerMetadata {
  // ID of the load balancer that is being started.
  string load_balancer_id = 1;
}

message StopLoadBalancerRequest {
  // ID of the load balancer to stop.
  string load_balancer_id = 1 [(required) = true];
}

message StopLoadBalancerMetadata {
  // ID of the load balancer that is being stopped.
  string load_balancer_id = 1;
}
