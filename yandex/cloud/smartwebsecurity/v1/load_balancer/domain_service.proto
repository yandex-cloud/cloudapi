syntax = "proto3";

package yandex.cloud.smartwebsecurity.v1.load_balancer;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "yandex/cloud/api/operation.proto";
import "yandex/cloud/operation/operation.proto";
import "yandex/cloud/smartwebsecurity/v1/load_balancer/load_balancer.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/smartwebsecurity/v1/load_balancer;smartwebsecurity";
option java_package = "yandex.cloud.api.smartwebsecurity.v1.load_balancer";

// A set of methods for managing domains of a Smart Web Security load balancer.
service DomainService {
  // Returns the specified domain.
  rpc Get(GetDomainRequest) returns (Domain) {
    option (google.api.http) = {
      get: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}/domains/{domain_name}"
    };
  };

  // Lists domains of the specified load balancer.
  rpc List(ListDomainsRequest) returns (ListDomainsResponse) {
    option (google.api.http) = {
      get: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}/domains"
    };
  };

  // Creates a domain in the specified load balancer.
  rpc Create(CreateDomainRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "CreateDomainMetadata"
      response: "Domain"
    };
    option (google.api.http) = {
      body: "*"
      post: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}/domains"
    };
  };

  // Updates the specified domain.
  rpc Update(UpdateDomainRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "UpdateDomainMetadata"
      response: "Domain"
    };
    option (google.api.http) = {
      body: "*"
      patch: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}/domains/{name}"
    };
  };

  // Deletes the specified domain.
  rpc Delete(DeleteDomainRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "DeleteDomainMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/smartwebsecurity/v1/loadBalancers/{load_balancer_id}/domains/{name}"
    };
  };

}

message GetDomainRequest {
  // ID of the Load balancer that the domain belongs to.
  string load_balancer_id = 1 [(required) = true];

  // Name of the Domain resource to return.
  string domain_name = 2 [(required) = true];
}

message ListDomainsRequest {
  // ID of the Load balancer that the domain belongs to.
  string load_balancer_id = 1 [(required) = true];
}

message ListDomainsResponse {
  // List of domains.
  repeated Domain domains = 1;
}

message CreateDomainRequest {
  // ID of the Load balancer that the domain belongs to.
  string load_balancer_id = 1 [(required) = true];

  // Unique name of domain within the balancer.
  // Will be used for monitoring naming and error messages.
  // If empty, will be generated automaticly from server_name.
  string name = 2 [(pattern) = "|[a-z][-a-z0-9]{1,56}[a-z0-9]"];

  // Server name or wildcard to be matched against SNI in a TLS connection and authority(host) header.
  // Wildcards are in the form of "*.s.o.m.e".
  // Allowed: "example.com", "*.example.com".
  // Not allowed: "*.*.example.com", "*-sub.example.com".
  string server_name = 3 [
    (length) = "1-255",
    (required) = true
  ];

  // Domain description.
  string description = 4 [(length) = "<=512"];

  // Security Profile ID of SmartWebSecurity service.
  string security_profile_id = 5;

  // Backend settings.
  HttpBackend http_backend = 6;

  // Optional TLS listener settings.
  TlsListener tls_listener = 7;

  // Optional plaintext listener settings.
  HttpListener http_listener = 8;

  // Optional Solid WAF settings.
  SolidWafSettings solid_waf_settings = 9;

  // Optional rate limit settings.
  RateLimit rate_limit = 10;
}

message CreateDomainMetadata {
  // ID of the Load balancer that the domain is being created.
  string load_balancer_id = 1;

  // Name of the domain that is being created.
  string domain_name = 2;

  // The load balancer update operation that started as a result of creating the domain.
  string load_balancer_update_operation_id = 3;
}

message UpdateDomainRequest {
  reserved 11;

  // ID of the Load balancer that the domain belongs to.
  string load_balancer_id = 1 [(required) = true];

  // Name of domain that is being updated.
  string name = 2 [(required) = true];

  // List of fields to update.
  google.protobuf.FieldMask update_mask = 3;

  // Server name or wildcard to be matched against SNI in a TLS connection and authority(host) header.
  // Wildcards are in the form of "*.s.o.m.e".
  // Allowed: "example.com", "*.example.com".
  // Not allowed: "*.*.example.com", "*-sub.example.com".
  string server_name = 4 [
    (length) = "1-255",
    (required) = true
  ];

  // Domain description
  string description = 5 [(length) = "<=512"];

  // Security Profile ID of SmartWebSecurity service.
  string security_profile_id = 6;

  // Backend settings.
  HttpBackend http_backend = 7;

  // Optional TLS listener settings.
  TlsListener tls_listener = 8;

  // Optional plaintext listener settings.
  HttpListener http_listener = 9;

  // Optional Solid WAF settings.
  SolidWafSettings solid_waf_settings = 10;

  // Optional rate limit settings.
  RateLimit rate_limit = 12;
}

message UpdateDomainMetadata {
  // ID of the Load balancer where a domain is being updated.
  string load_balancer_id = 1;

  // Name of the updated domain.
  string domain_name = 2;

  // The load balancer update operation that started as a result of updating the domain.
  string load_balancer_update_operation_id = 3;
}

message DeleteDomainRequest {
  // ID of the Load balancer to delete a domain in.
  string load_balancer_id = 1 [(required) = true];

  // Name of the domain to delete.
  string name = 2 [(required) = true];
}

message DeleteDomainMetadata {
  // ID of the Load balancer where a domain is being deleted.
  string load_balancer_id = 1;

  // Name of the domain that is being deleted.
  string domain_name = 2;

  // The load balancer update operation that started as a result of deleting the domain.
  string load_balancer_update_operation_id = 3;
}
