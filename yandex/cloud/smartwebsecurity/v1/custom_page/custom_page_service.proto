syntax = "proto3";

package yandex.cloud.smartwebsecurity.v1.custom_page;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "yandex/cloud/api/operation.proto";
import "yandex/cloud/operation/operation.proto";
import "yandex/cloud/smartwebsecurity/v1/custom_page/custom_page.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/smartwebsecurity/v1/custom_page;smartwebsecurity";
option java_package = "yandex.cloud.api.smartwebsecurity.v1.custom_page";

// A set of methods for managing CustomPage resources.
service CustomPageService {
  // Returns the specified CustomPage resource.
  rpc Get(GetCustomPageRequest) returns (CustomPage) {
    option (google.api.http) = {
      get: "/smartwebsecurity/v1/customPages/{custom_page_id}"
    };
  };

  // Retrieves the list of CustomPage resources in the specified folder.
  rpc List(ListCustomPagesRequest) returns (ListCustomPagesResponse) {
    option (google.api.http) = {
      get: "/smartwebsecurity/v1/customPages"
    };
  };

  // Creates a CustomPage resource in the specified folder.
  rpc Create(CreateCustomPageRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "CreateCustomPageMetadata"
      response: "CustomPage"
    };
    option (google.api.http) = {
      body: "*"
      post: "/smartwebsecurity/v1/customPages"
    };
  };

  // Updates the specified CustomPage resource.
  rpc Update(UpdateCustomPageRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "UpdateCustomPageMetadata"
      response: "CustomPage"
    };
    option (google.api.http) = {
      body: "*"
      patch: "/smartwebsecurity/v1/customPages/{custom_page_id}"
    };
  };

  // Deletes the specified CustomPage resource.
  rpc Delete(DeleteCustomPageRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "DeleteCustomPageMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/smartwebsecurity/v1/customPages/{custom_page_id}"
    };
  };

}

message GetCustomPageRequest {
  // ID of the custom page to return.
  string custom_page_id = 1 [(required) = true];
}

message ListCustomPagesRequest {
  // ID of the folder to list custom pages in.
  string folder_id = 1 [(required) = true];

  // The maximum number of results per page to return.
  int64 page_size = 2 [(value) = "0-1000"];

  // Page token. Set to the `next_page_token` returned by a previous list request.
  string page_token = 3 [(length) = "<=100"];

  // A filter expression that filters custom pages listed in the response.
  string filter = 4 [(length) = "<=1000"];

  // By which column the listing should be ordered and in which direction.
  string order_by = 5 [(length) = "<=100"];
}

message ListCustomPagesResponse {
  // List of custom page resources.
  repeated CustomPage custom_pages = 1;

  // Token for getting the next page of the list.
  string next_page_token = 2;
}

message CreateCustomPageRequest {
  reserved 8 to 11;

  // ID of the folder to create the custom page in.
  string folder_id = 1 [(required) = true];

  // Resource labels as `key:value` pairs.
  map<string, string> labels = 2 [
    (length) = "<=63",
    (map_key) = {
      length: "1-63"
      pattern: "[a-z][-_0-9a-z]*"
    },
    (pattern) = "[-_0-9a-z]*",
    (size) = "<=64"
  ];

  // Name of the custom page.
  string name = 3 [
    (length) = "1-50",
    (pattern) = "[a-zA-Z0-9][a-zA-Z0-9-_.]*"
  ];

  // Description of the custom page.
  string description = 4 [(length) = "<=512"];

  // Content of the custom page.
  string content = 5;

  // MIME type of the custom page content.
  string content_type = 6;

  // HTTP status code returned with the custom page.
  CustomPage.StatusCode status_code = 7;

  // HTTP response headers returned with the custom page.
  map<string, string> headers = 12 [
    (length) = "<=256",
    (map_key) = {
      length: "1-128"
      pattern: "[!#$%&'*+.^_\\x60|~0-9A-Za-z-]*"
    },
    (pattern) = "[\\t\\x20-\\x7E]*",
    (size) = "<=10"
  ];
}

message UpdateCustomPageRequest {
  reserved 9 to 11;

  // ID of the custom page to update.
  string custom_page_id = 1 [(required) = true];

  // Field mask that specifies which fields of the custom page are going to be updated.
  google.protobuf.FieldMask update_mask = 2;

  // Resource labels as `key:value` pairs.
  map<string, string> labels = 3 [
    (length) = "<=63",
    (map_key) = {
      length: "1-63"
      pattern: "[a-z][-_0-9a-z]*"
    },
    (pattern) = "[-_0-9a-z]*",
    (size) = "<=64"
  ];

  // Name of the custom page.
  string name = 4 [
    (length) = "1-50",
    (pattern) = "[a-zA-Z0-9][a-zA-Z0-9-_.]*"
  ];

  // Description of the custom page.
  string description = 5 [(length) = "<=512"];

  // Content of the custom page.
  string content = 6;

  // MIME type of the custom page content.
  string content_type = 7;

  // HTTP status code returned with the custom page.
  CustomPage.StatusCode status_code = 8;

  // HTTP response headers returned with the custom page.
  map<string, string> headers = 12 [
    (length) = "<=256",
    (map_key) = {
      length: "1-128"
      pattern: "[!#$%&'*+.^_\\x60|~0-9A-Za-z-]*"
    },
    (pattern) = "[\\t\\x20-\\x7E]*",
    (size) = "<=10"
  ];
}

message DeleteCustomPageRequest {
  // ID of the custom page to delete.
  string custom_page_id = 1 [(required) = true];
}

message CreateCustomPageMetadata {
  // ID of the custom page that is being created.
  string custom_page_id = 1;
}

message UpdateCustomPageMetadata {
  // ID of the custom page that is being updated.
  string custom_page_id = 1;
}

message DeleteCustomPageMetadata {
  // ID of the custom page that is being deleted.
  string custom_page_id = 1;
}
