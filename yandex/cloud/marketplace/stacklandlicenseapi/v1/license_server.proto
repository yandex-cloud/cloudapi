syntax = "proto3";

package yandex.cloud.marketplace.stacklandlicenseapi.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/marketplace/stacklandlicenseapi/v1;stacklandlicenseapi";
option java_package = "yandex.cloud.api.marketplace.stacklandlicenseapi.v1";

// License server metadata
message LicenseServerMetadata {
  // Custom labels for the license server
  map<string, string> labels = 1;
}

// Request to register a license server
message RegisterRequest {
  reserved 1 to 2;
  reserved "organization_id";
  reserved "billing_account_id";

  // Optional metadata for the license server
  LicenseServerMetadata metadata = 3;
}

// License server entity
message LicenseServer {
  // Unique server ID
  string server_id = 1 [(google.api.field_behavior) = IDENTIFIER];

  // License server CA certificate
  string ls_ca_certificate = 2;

  // Private key for the license server
  string ls_private_key = 3;

  // Timestamp when the credentials expire
  google.protobuf.Timestamp valid_until = 4;

  // PEM-encoded PKIX public key for verifying license signatures
  string ls_signing_public_key = 5;

  // User-provided human-readable license server name
  string display_name = 6;

  // User-provided license server description
  string description = 7;

  // Organization that owns the license server
  string organization_id = 8 [(google.api.field_behavior) = IMMUTABLE];

  // Billing account associated with the license server
  string billing_account_id = 9 [(google.api.field_behavior) = IMMUTABLE];

  // Timestamp when the license server was created
  google.protobuf.Timestamp created_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the license server was last updated
  google.protobuf.Timestamp updated_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Metadata for register license server operation
message RegisterLicenseServerMetadata {
  // Organization ID
  string organization_id = 1;

  // Billing account ID
  string billing_account_id = 2;
}
