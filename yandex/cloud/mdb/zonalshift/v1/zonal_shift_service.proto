syntax = "proto3";

package yandex.cloud.mdb.zonalshift.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/mdb/zonalshift/v1;zonalshift";
option java_package = "yandex.cloud.api.mdb.zonalshift.v1";

// A set of methods for managing MDB zonal shift configurations.
//
// A zonal shift configuration describes a planned "drill" (for example, temporarily
// disabling an availability zone) that is periodically or one-time launched against one
// or more MDB clusters. The configuration is fully managed by the user
// (create / update / delete), while the actual runs ([ZonalShiftTask]) are managed by
// the system: the user can only read them or cancel an active one.
service ZonalShiftService {
  // Returns the specified zonal shift configuration.
  // To get the list of all available configurations, make a [List] request.
  // To get the runs of the configuration, make a [ListTasks] request.
  rpc Get(GetZonalShiftConfigRequest) returns (ZonalShiftConfig) {
    option (google.api.http) = {
      get: "/managed-zonalshift/v1/configs/{config_id}"
    };
  };

  // Retrieves the list of zonal shift configurations for the specified MDB cluster.
  rpc List(ListZonalShiftConfigsRequest) returns (ListZonalShiftConfigsResponse) {
    option (google.api.http) = {
      get: "/managed-zonalshift/v1/configs"
    };
  };

  // Retrieves the list of zonal shift configurations attached to the specified MDB cluster.
  rpc ListByCluster(ListZonalShiftConfigsByClusterRequest) returns (ListZonalShiftConfigsResponse) {
    option (google.api.http) = {
      get: "/managed-zonalshift/v1/clusters/{cluster_id}/configs"
    };
  };

  // Retrieves the list of runs ([ZonalShiftTask]) of the specified zonal shift configuration.
  rpc ListTasks(ListZonalShiftTasksRequest) returns (ListZonalShiftTasksResponse) {
    option (google.api.http) = {
      get: "/managed-zonalshift/v1/configs/{config_id}/tasks"
    };
  };

  // Retrieves the list of drill types supported by the service together with the shape of
  // their configs. Clients use it to build the UI for creating zonal shift configurations.
  rpc ListDrillTypes(ListDrillTypesRequest) returns (ListDrillTypesResponse) {
    option (google.api.http) = {
      get: "/managed-zonalshift/v1/drillTypes"
    };
  };

  // Creates a zonal shift configuration for the specified MDB cluster.
  // The configuration is written synchronously and the created resource is returned.
  rpc Create(CreateZonalShiftConfigRequest) returns (ZonalShiftConfig) {
    option (google.api.http) = {
      body: "*"
      post: "/managed-zonalshift/v1/configs"
    };
  };

  // Updates the specified zonal shift configuration and returns the updated resource.
  // The request fails with `FAILED_PRECONDITION` if the configuration has an active run
  // (a [ZonalShiftTask] in the `PLANNED`, `RUNNING` or `CANCEL_REQUESTED` state).
  rpc Update(UpdateZonalShiftConfigRequest) returns (ZonalShiftConfig) {
    option (google.api.http) = {
      body: "*"
      patch: "/managed-zonalshift/v1/configs/{config_id}"
    };
  };

  // Deletes the specified zonal shift configuration.
  // The request fails with `FAILED_PRECONDITION` if the configuration has an active run
  // (a [ZonalShiftTask] in the `PLANNED`, `RUNNING` or `CANCEL_REQUESTED` state).
  rpc Delete(DeleteZonalShiftConfigRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/managed-zonalshift/v1/configs/{config_id}"
    };
  };

  // Cancels the specified zonal shift run ([ZonalShiftTask]) requested by the user and returns
  // the updated run.
  rpc Cancel(CancelZonalShiftTaskRequest) returns (ZonalShiftTask) {
    option (google.api.http) = {
      post: "/managed-zonalshift/v1/tasks/{task_id}:cancel"
    };
  };

}

// Parameters of a `DISABLE_ZONE` drill.
message DisableZoneDrillConfig {
  // ID of the availability zone to disable during the drill.
  string zone = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // If set, the availability prediction check for the zone is skipped before the drill starts.
  bool skip_predict_availability = 2;

  // If set, the cluster health check is skipped before the drill starts.
  bool skip_health_check = 3;
}

// Drill parameters. The set option determines the type of the drill to perform.
message DrillConfig {
  oneof config {
    // Parameters of a `DISABLE_ZONE` drill.
    DisableZoneDrillConfig disable_zone_config = 1;
  }
}

// Description of a single drill type supported by the service.
message DrillTypeInfo {
  // Identifier of the drill type (for example, `DISABLE_ZONE`).
  string drill_type = 1 [(length) = "<=50"];

  // Drill config whose set oneof option corresponds to this drill type, populated with
  // example values. It lets clients discover which config message maps to the drill type
  // and the shape of its fields.
  DrillConfig drill_config = 2;
}

// Schedule of a zonal shift configuration. Exactly one of the options must be set.
message ZonalShiftSchedule {
  oneof schedule {
    option (exactly_one) = true;

    // Cron expression for a recurring drill.
    string cron_expression = 1 [(length) = "<=100"];

    // Time of a single (one-time) drill.
    google.protobuf.Timestamp run_date = 2;
  }
}

// A zonal shift configuration resource.
message ZonalShiftConfig {
  reserved 4;

  // ID of the zonal shift configuration.
  string id = 1 [(length) = "<=50"];

  // IDs of the MDB clusters the configuration is attached to.
  // For now only one cluster is supported, but the field is repeated to allow grouping in the future.
  repeated string cluster_ids = 2 [(length) = "<=50"];

  // Drill parameters. The set option determines the type of the drill.
  DrillConfig drill_config = 3;

  // Duration of a single drill run.
  google.protobuf.Duration duration = 5;

  // Description of the zonal shift configuration.
  string description = 6 [(length) = "<=256"];

  // Drill schedule (recurring or one-time).
  ZonalShiftSchedule schedule = 7;

  // Time when the configuration was created.
  google.protobuf.Timestamp created_at = 8;

  // Time when the configuration was last updated.
  google.protobuf.Timestamp updated_at = 9;
}

// A single run (task) of a zonal shift configuration.
// Tasks are managed by the system and cannot be modified by the user.
message ZonalShiftTask {
  reserved 6;

  // State of a zonal shift run.
  enum State {
    // State is not specified.
    STATE_UNSPECIFIED = 0;

    // The run is created but not started yet.
    PLANNED = 1;

    // The run is in progress, the zone is being held isolated.
    RUNNING = 2;

    // The user requested cancellation, the run is being rolled back.
    CANCEL_REQUESTED = 3;

    // The run was cancelled and all rollback actions are done.
    CANCELED = 4;

    // The run finished successfully by reaching its duration.
    COMPLETED = 5;

    // The run finished with an error.
    FAILED = 6;
  }

  // ID of the run.
  string id = 1 [(length) = "<=50"];

  // ID of the zonal shift configuration this run belongs to.
  string config_id = 2 [(length) = "<=50"];

  // IDs of the MDB clusters this run is launched against.
  repeated string cluster_ids = 3 [(length) = "<=50"];

  // Current state of the run.
  State state = 4;

  // Drill parameters, copied from the configuration at the moment the run was planned.
  DrillConfig drill_config = 5;

  // Duration of the run, copied from the configuration at the moment the run was planned.
  google.protobuf.Duration duration = 7;

  // Time when the run was created.
  google.protobuf.Timestamp created_at = 8;

  // Time when the run was last updated.
  google.protobuf.Timestamp updated_at = 9;

  // Time when the run is planned to start.
  google.protobuf.Timestamp planned_at = 10;

  // Time when the run actually started. Empty until the run starts.
  google.protobuf.Timestamp started_at = 11;

  // Time when the run finished. Empty until the run finishes.
  google.protobuf.Timestamp finished_at = 12;

  // Chain of events produced during the run.
  repeated ZonalShiftTaskEvent events = 13;
}

// A single event in the lifecycle of a zonal shift run.
// Events are append-only and cannot be modified.
message ZonalShiftTaskEvent {
  // Human-readable description of the event.
  string message = 1;

  // Additional machine-readable details of the event.
  google.protobuf.Struct metadata = 2;

  // Time when the event occurred.
  google.protobuf.Timestamp created_at = 3;
}

message GetZonalShiftConfigRequest {
  // ID of the zonal shift configuration to return.
  // To get the configuration ID, use a [ZonalShiftService.List] request.
  string config_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message ListZonalShiftConfigsRequest {
  // ID of the folder to list zonal shift configurations in.
  // To get the folder ID, use a [yandex.cloud.resourcemanager.v1.FolderService.List] request.
  string folder_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // The maximum number of results per page to return.
  // If the number of available results is larger than [page_size], the service returns
  // a [ListZonalShiftConfigsResponse.next_page_token] that can be used to get the next page
  // of results in subsequent list requests.
  int64 page_size = 2 [(value) = "<=1000"];

  // Page token. To get the next page of results, set [page_token] to the
  // [ListZonalShiftConfigsResponse.next_page_token] returned by the previous list request.
  string page_token = 3 [(length) = "<=100"];
}

message ListZonalShiftConfigsResponse {
  // List of zonal shift configurations.
  repeated ZonalShiftConfig configs = 1;

  // This token allows you to get the next page of results for list requests.
  // If the number of results is larger than [ListZonalShiftConfigsRequest.page_size], use the
  // [next_page_token] as the value for the [ListZonalShiftConfigsRequest.page_token] parameter
  // in the next list request. Each subsequent list request has its own [next_page_token]
  // to continue paging through the results.
  string next_page_token = 2;
}

message ListZonalShiftConfigsByClusterRequest {
  // ID of the MDB cluster to list zonal shift configurations for.
  // To get the cluster ID, use a [ClusterService.List] request.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // The maximum number of results per page to return.
  // If the number of available results is larger than [page_size], the service returns
  // a [ListZonalShiftConfigsResponse.next_page_token] that can be used to get the next page
  // of results in subsequent list requests.
  int64 page_size = 2 [(value) = "<=1000"];

  // Page token. To get the next page of results, set [page_token] to the
  // [ListZonalShiftConfigsResponse.next_page_token] returned by the previous list request.
  string page_token = 3 [(length) = "<=100"];
}

message ListZonalShiftTasksRequest {
  // ID of the zonal shift configuration to list runs for.
  // To get the configuration ID, use a [ZonalShiftService.List] request.
  string config_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // The maximum number of results per page to return.
  // If the number of available results is larger than [page_size], the service returns
  // a [ListZonalShiftTasksResponse.next_page_token] that can be used to get the next page
  // of results in subsequent list requests.
  int64 page_size = 2 [(value) = "<=1000"];

  // Page token. To get the next page of results, set [page_token] to the
  // [ListZonalShiftTasksResponse.next_page_token] returned by the previous list request.
  string page_token = 3 [(length) = "<=100"];
}

message ListZonalShiftTasksResponse {
  // List of zonal shift runs.
  repeated ZonalShiftTask tasks = 1;

  // This token allows you to get the next page of results for list requests.
  // If the number of results is larger than [ListZonalShiftTasksRequest.page_size], use the
  // [next_page_token] as the value for the [ListZonalShiftTasksRequest.page_token] parameter
  // in the next list request. Each subsequent list request has its own [next_page_token]
  // to continue paging through the results.
  string next_page_token = 2;
}

message ListDrillTypesRequest {
}

message ListDrillTypesResponse {
  // List of supported drill types with the shape of their configs.
  repeated DrillTypeInfo drill_types = 1;
}

message CreateZonalShiftConfigRequest {
  reserved 4;

  // ID of the folder to create the zonal shift configuration in.
  string folder_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // ID of the MDB cluster to create the zonal shift configuration for.
  // To get the cluster ID, use a [ClusterService.List] request.
  repeated string cluster_ids = 2 [
    (length) = "<=50",
    (size) = ">0"
  ];

  // Drill parameters. The set option determines the type of the drill to perform.
  DrillConfig drill_config = 3 [(required) = true];

  // Duration of a single drill run.
  google.protobuf.Duration duration = 5 [(required) = true];

  // Description of the zonal shift configuration.
  string description = 6 [(length) = "<=256"];

  // Drill schedule (recurring or one-time).
  ZonalShiftSchedule schedule = 7 [(required) = true];
}

message UpdateZonalShiftConfigRequest {
  reserved 5;

  // ID of the zonal shift configuration to update.
  // To get the configuration ID, use a [ZonalShiftService.List] request.
  string config_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Field mask that specifies which fields of the configuration should be updated.
  google.protobuf.FieldMask update_mask = 2;

  // IDs of MDB clusters the configuration belongs to.
  repeated string cluster_ids = 3 [(length) = "<=50"];

  // New drill parameters. The set option determines the type of the drill to perform.
  DrillConfig drill_config = 4;

  // New duration of a single drill run.
  google.protobuf.Duration duration = 6;

  // New description of the zonal shift configuration.
  string description = 7 [(length) = "<=256"];

  // New drill schedule (recurring or one-time).
  ZonalShiftSchedule schedule = 8;
}

message DeleteZonalShiftConfigRequest {
  // ID of the zonal shift configuration to delete.
  // To get the configuration ID, use a [ZonalShiftService.List] request.
  string config_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message CancelZonalShiftTaskRequest {
  // ID of the zonal shift run ([ZonalShiftTask]) to cancel.
  // To get the run ID, use a [ZonalShiftService.ListTasks] request.
  string task_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}
