services:
  - name: BackupService
    tools:
      - method: Get
      - method: List
      - method: Delete
        disabled: true

  - name: ClusterService
    tools:
      - method: Get
      - method: List
      - method: Create
        tags: ["sensitive"]
        input:
          - field: config_spec
            inner:
              - field: redis_config_5_0
                disabled: true
              - field: redis_config_6_0
                disabled: true
              - field: redis_config_6_2
                disabled: true
              - field: redis_config_7_0
                disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: Update
        tags: ["sensitive"]
        input:
          - field: config_spec
            inner:
              - field: redis_config_5_0
                disabled: true
              - field: redis_config_6_0
                disabled: true
              - field: redis_config_6_2
                disabled: true
              - field: redis_config_7_0
                disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: Delete
        disabled: true
      - method: Start
      - method: Stop
      - method: Move
      - method: Backup
      - method: Restore
        tags: ["sensitive"]
        input:
          - field: config_spec
            inner:
              - field: redis_config_5_0
                disabled: true
              - field: redis_config_6_0
                disabled: true
              - field: redis_config_6_2
                disabled: true
              - field: redis_config_7_0
                disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: RescheduleMaintenance
      - method: StartFailover
      - method: ListLogs
      - method: StreamLogs
      - method: ListOperations
      - method: ListBackups
      - method: ListHosts
      - method: AddHosts
      - method: DeleteHosts
        disabled: true
      - method: UpdateHosts
      - method: GetShard
      - method: ListShards
      - method: AddShard
      - method: DeleteShard
        disabled: true
      - method: Rebalance
      - method: EnableSharding
      - method: ListAccessBindings
      - method: SetAccessBindings
        disabled: true
      - method: UpdateAccessBindings

  - name: ResourcePresetService
    tools:
      - method: Get
      - method: List

  - name: UserService
    tools:
      - method: Get
      - method: List
      - method: Create
        tags: ["sensitive"]
      - method: Update
        tags: ["sensitive"]
      - method: Delete
        disabled: true
