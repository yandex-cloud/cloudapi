syntax = "proto3";

package yandex.cloud.mdb.redis.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/type/timeofday.proto";
import "yandex/cloud/access/access.proto";
import "yandex/cloud/api/operation.proto";
import "yandex/cloud/mdb/redis/v1/backup.proto";
import "yandex/cloud/mdb/redis/v1/cluster.proto";
import "yandex/cloud/mdb/redis/v1/config/redis.proto";
import "yandex/cloud/mdb/redis/v1/config/redis5_0.proto";
import "yandex/cloud/mdb/redis/v1/config/redis6_0.proto";
import "yandex/cloud/mdb/redis/v1/config/redis6_2.proto";
import "yandex/cloud/mdb/redis/v1/config/redis7_0.proto";
import "yandex/cloud/mdb/redis/v1/maintenance.proto";
import "yandex/cloud/mdb/redis/v1/user.proto";
import "yandex/cloud/operation/operation.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/mdb/redis/v1;redis";
option java_package = "yandex.cloud.api.mdb.redis.v1";

// A set of methods for managing Valkey clusters.
service ClusterService {
  // Returns the specified Valkey cluster.
  // To get the list of available Valkey clusters, make a [List] request.
  rpc Get(GetClusterRequest) returns (Cluster) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}"
    };
  };

  // Retrieves the list of Valkey clusters that belong
  // to the specified folder.
  rpc List(ListClustersRequest) returns (ListClustersResponse) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters"
    };
  };

  // Creates a Valkey cluster in the specified folder.
  rpc Create(CreateClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "CreateClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters"
    };
  };

  // Updates the specified Valkey cluster.
  rpc Update(UpdateClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "UpdateClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      body: "*"
      patch: "/managed-redis/v1/clusters/{cluster_id}"
    };
  };

  // Deletes the specified Valkey cluster.
  rpc Delete(DeleteClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "DeleteClusterMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/managed-redis/v1/clusters/{cluster_id}"
    };
  };

  // Start the specified Valkey cluster.
  rpc Start(StartClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "StartClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      post: "/managed-redis/v1/clusters/{cluster_id}:start"
    };
  };

  // Stop the specified Valkey cluster.
  rpc Stop(StopClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "StopClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      post: "/managed-redis/v1/clusters/{cluster_id}:stop"
    };
  };

  // Moves a Valkey cluster to the specified folder.
  rpc Move(MoveClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "MoveClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{cluster_id}:move"
    };
  };

  // Creates a backup for the specified Valkey cluster.
  rpc Backup(BackupClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "BackupClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      post: "/managed-redis/v1/clusters/{cluster_id}:backup"
    };
  };

  // Creates a new Valkey cluster using the specified backup.
  rpc Restore(RestoreClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "RestoreClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters:restore"
    };
  };

  // Reschedules planned maintenance operation.
  rpc RescheduleMaintenance(RescheduleMaintenanceRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "RescheduleMaintenanceMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{cluster_id}:rescheduleMaintenance"
    };
  };

  // Start a manual failover on the specified Valkey cluster.
  rpc StartFailover(StartClusterFailoverRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "StartClusterFailoverMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{cluster_id}:startFailover"
    };
  };

  // Retrieves logs for the specified Valkey cluster.
  rpc ListLogs(ListClusterLogsRequest) returns (ListClusterLogsResponse) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}:logs"
    };
  };

  // Same as ListLogs but using server-side streaming. Also allows for 'tail -f' semantics.
  // (-- api-linter: yc::1705::http-method-mapping=disabled --)
  rpc StreamLogs(StreamClusterLogsRequest) returns (stream StreamLogRecord) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}:stream_logs"
    };
  };

  // Retrieves the list of operations for the specified cluster.
  rpc ListOperations(ListClusterOperationsRequest) returns (ListClusterOperationsResponse) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}/operations"
    };
  };

  // Retrieves the list of available backups for the specified Valkey cluster.
  rpc ListBackups(ListClusterBackupsRequest) returns (ListClusterBackupsResponse) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}/backups"
    };
  };

  // Retrieves a list of hosts for the specified cluster.
  rpc ListHosts(ListClusterHostsRequest) returns (ListClusterHostsResponse) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}/hosts"
    };
  };

  // Creates new hosts for a cluster.
  rpc AddHosts(AddClusterHostsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "AddClusterHostsMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{cluster_id}/hosts:batchCreate"
    };
  };

  // Deletes the specified hosts for a cluster.
  //
  // (-- api-linter: yc::1705::http-method-mapping=disabled --)
  rpc DeleteHosts(DeleteClusterHostsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "DeleteClusterHostsMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{cluster_id}/hosts:batchDelete"
    };
  };

  // Updates the specified hosts.
  // (-- api-linter: yc::1705::http-method-mapping=disabled --)
  rpc UpdateHosts(UpdateClusterHostsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "UpdateClusterHostsMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{cluster_id}/hosts:batchUpdate"
    };
  };

  // Returns the specified shard.
  rpc GetShard(GetClusterShardRequest) returns (Shard) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}/shards/{shard_name}"
    };
  };

  // Retrieves a list of shards.
  rpc ListShards(ListClusterShardsRequest) returns (ListClusterShardsResponse) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{cluster_id}/shards"
    };
  };

  // Creates a new shard.
  // (-- api-linter: core::0136::http-uri-suffix=disabled --)
  // (-- api-linter: yc::1705::custom-method-colon=disabled --)
  rpc AddShard(AddClusterShardRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "AddClusterShardMetadata"
      response: "Shard"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{cluster_id}/shards"
    };
  };

  // Deletes the specified shard.
  rpc DeleteShard(DeleteClusterShardRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "DeleteClusterShardMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/managed-redis/v1/clusters/{cluster_id}/shards/{shard_name}"
    };
  };

  // Rebalances the cluster. Evenly distributes all the hash slots between the shards.
  rpc Rebalance(RebalanceClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "RebalanceClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      post: "/managed-redis/v1/clusters/{cluster_id}:rebalance"
    };
  };

  // Enable Sharding on non sharded cluster.
  rpc EnableSharding(EnableShardingClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "EnableShardingClusterMetadata"
      response: "Cluster"
    };
    option (google.api.http) = {
      post: "/managed-redis/v1/clusters/{cluster_id}:enable_sharding"
    };
  };

  // Retrieves a list of access bindings for the specified Valkey cluster.
  rpc ListAccessBindings(access.ListAccessBindingsRequest) returns (access.ListAccessBindingsResponse) {
    option (google.api.http) = {
      get: "/managed-redis/v1/clusters/{resource_id}:listAccessBindings"
    };
  };

  // Sets access bindings for the specified Valkey cluster.
  rpc SetAccessBindings(access.SetAccessBindingsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "access.SetAccessBindingsMetadata"
      response: "access.AccessBindingsOperationResult"
    };
    option (google.api.http) = {
      body: "*"
      post: "/managed-redis/v1/clusters/{resource_id}:setAccessBindings"
    };
  };

  // Updates access bindings for the specified Valkey cluster.
  rpc UpdateAccessBindings(access.UpdateAccessBindingsRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "access.UpdateAccessBindingsMetadata"
      response: "access.AccessBindingsOperationResult"
    };
    option (google.api.http) = {
      body: "*"
      patch: "/managed-redis/v1/clusters/{resource_id}:updateAccessBindings"
    };
  };

}

message EnableShardingClusterMetadata {
  // ID of the Valkey cluster that is being switched to sharded mode.
  string cluster_id = 1;
}

message EnableShardingClusterRequest {
  // ID of the Valkey cluster to return.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message GetClusterRequest {
  // ID of the Valkey cluster to return.
  // To get the cluster ID use a [ClusterService.List] request.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message ListClustersRequest {
  // ID of the folder to list Valkey clusters in.
  // To get the folder ID, use a [yandex.cloud.resourcemanager.v1.FolderService.List] request.
  string folder_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // The maximum number of results per page to return. If the number of available
  // results is larger than [page_size], the service returns a [ListClustersResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests.
  int64 page_size = 2 [(value) = "0-1000"];

  // Page token. To get the next page of results, set [page_token] to the [ListClustersResponse.next_page_token]
  // returned by the previous list request.
  string page_token = 3 [(length) = "<=100"];

  // A filter expression that filters clusters listed in the response.
  // The expression must specify:
  // 1. The field name. Currently you can only use filtering with the [Cluster.name] field.
  // 2. An `=` operator.
  // 3. The value in double quotes (`"`). Must be 3-63 characters long and match the regular expression `[a-z]([-a-z0-9]{,61}[a-z0-9])?`.
  string filter = 4 [(length) = "<=1000"];
}

message ListClustersResponse {
  // List of Valkey clusters.
  repeated Cluster clusters = 1;

  // This token allows you to get the next page of results for list requests. If the number of results
  // is larger than [ListClustersRequest.page_size], use the [next_page_token] as the value
  // for the [ListClustersRequest.page_token] parameter in the next list request. Each subsequent
  // list request will have its own [next_page_token] to continue paging through the results.
  string next_page_token = 2;
}

message CreateClusterRequest {
  reserved 8 to 9;

  // ID of the folder to create the Valkey cluster in.
  string folder_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Name of the Valkey cluster. The name must be unique within the folder.
  string name = 2 [
    (length) = "<=63",
    (pattern) = "[a-zA-Z0-9_-]*",
    (required) = true
  ];

  // Description of the Valkey cluster.
  string description = 3 [(length) = "<=256"];

  // Custom labels for the Valkey cluster as `key:value` pairs. Maximum 64 per cluster.
  // For example, "project": "mvp" or "source": "dictionary".
  map<string, string> labels = 4 [
    (length) = "<=63",
    (map_key) = {
      length: "<=63"
      pattern: "[a-z][-_./\\@0-9a-z]*"
    },
    (pattern) = "[-_0-9a-z]*",
    (size) = "<=64"
  ];

  // Deployment environment of the Valkey cluster.
  Cluster.Environment environment = 5 [(required) = true];

  // Configuration and resources for hosts that should be created for the Valkey cluster.
  ConfigSpec config_spec = 6 [(required) = true];

  // Individual configurations for hosts that should be created for the Valkey cluster.
  repeated HostSpec host_specs = 7 [(size) = ">0"];

  // ID of the network to create the cluster in.
  string network_id = 10 [(length) = "<=150"];

  // Valkey cluster mode on/off.
  bool sharded = 11;

  // User security groups
  repeated string security_group_ids = 12;

  // TLS port and functionality on\off
  google.protobuf.BoolValue tls_enabled = 13;

  // Deletion Protection inhibits deletion of the cluster
  bool deletion_protection = 14;

  // Persistence mode
  Cluster.PersistenceMode persistence_mode = 15;

  // Enable FQDN instead of ip
  bool announce_hostnames = 16;

  // Window of maintenance operations.
  MaintenanceWindow maintenance_window = 17 [deprecated = true];

  // Descriptions of users to be created in the Valkey cluster.
  repeated UserSpec user_specs = 18 [(size) = ">=0"];

  // Allows to use ACL users to auth in sentinel
  bool auth_sentinel = 19;

  // ID of the key to encrypt cluster disks.
  google.protobuf.StringValue disk_encryption_key_id = 20 [(pattern) = "[a-zA-Z0-9_.-]{0,50}"];
}

message CreateClusterMetadata {
  // ID of the Valkey cluster that is being created.
  string cluster_id = 1;
}

message UpdateClusterRequest {
  // ID of the Valkey cluster to update.
  // To get the Valkey cluster ID, use a [ClusterService.List] request.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Field mask that specifies which fields of the Valkey cluster should be updated.
  google.protobuf.FieldMask update_mask = 2;

  // New description of the Valkey cluster.
  string description = 3 [(length) = "<=256"];

  // Custom labels for the Valkey cluster as `` key:value `` pairs. Maximum 64 per cluster.
  // For example, "project": "mvp" or "source": "dictionary".
  // The new set of labels will completely replace the old ones. To add a label, request the current
  // set with the [ClusterService.Get] method, then send an [ClusterService.Update] request with the new label added to the set.
  map<string, string> labels = 4 [
    (length) = "<=63",
    (map_key) = {
      length: "<=63"
      pattern: "[a-z][-_./\\@0-9a-z]*"
    },
    (pattern) = "[-_0-9a-z]*",
    (size) = "<=64"
  ];

  // New configuration and resources for hosts in the cluster.
  ConfigSpec config_spec = 5;

  // New name for the cluster.
  string name = 6 [
    (length) = "<=63",
    (pattern) = "[a-zA-Z0-9_-]*"
  ];

  // New maintenance window settings for the cluster.
  MaintenanceWindow maintenance_window = 7 [deprecated = true];

  // User security groups
  repeated string security_group_ids = 8;

  // Deletion Protection inhibits deletion of the cluster
  bool deletion_protection = 9;

  // Persistence mode
  Cluster.PersistenceMode persistence_mode = 10;

  // ID of the network to move the cluster to.
  string network_id = 11 [(length) = "<=150"];

  // Enable FQDN instead of ip
  bool announce_hostnames = 12;

  // Allows to use ACL users to auth in sentinel
  bool auth_sentinel = 13;
}

message UpdateClusterMetadata {
  // ID of the Valkey cluster that is being updated.
  string cluster_id = 1;
}

message DeleteClusterRequest {
  // ID of the Valkey cluster to delete.
  // To get the Valkey cluster ID, use a [ClusterService.List] request.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message DeleteClusterMetadata {
  // ID of the Valkey cluster that is being deleted.
  string cluster_id = 1;
}

message StartClusterRequest {
  // ID of the Valkey cluster to start.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message StartClusterMetadata {
  // ID of the Valkey cluster.
  string cluster_id = 1;
}

message StopClusterRequest {
  // ID of the Valkey cluster to stop.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message StopClusterMetadata {
  // ID of the Valkey cluster.
  string cluster_id = 1;
}

message MoveClusterRequest {
  // ID of the Valkey cluster to move.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // ID of the destination folder.
  string destination_folder_id = 2 [
    (length) = "<=50",
    (required) = true
  ];
}

message MoveClusterMetadata {
  // ID of the Valkey cluster being moved.
  string cluster_id = 1;

  // ID of the source folder.
  string source_folder_id = 2;

  // ID of the destination folder.
  string destination_folder_id = 3;
}

message UpdateClusterHostsRequest {
  // ID of the Valkey cluster to update hosts in.
  // To get the Valkey cluster ID, use a [ClusterService.List] request.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // New configurations to apply to hosts.
  repeated UpdateHostSpec update_host_specs = 2 [(size) = ">0"];
}

message UpdateClusterHostsMetadata {
  // ID of the Valkey cluster to update hosts in.
  string cluster_id = 1;

  // Names of hosts that are being updated.
  repeated string host_names = 2;
}

message BackupClusterRequest {
  // ID of the Valkey cluster to back up.
  // To get the Valkey cluster ID, use a [ClusterService.List] request.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message BackupClusterMetadata {
  // ID of the Valkey cluster that is being backed up.
  string cluster_id = 1;
}

message RestoreClusterRequest {
  // ID of the backup to create a cluster from.
  // To get the backup ID, use a [ClusterService.ListBackups] request.
  string backup_id = 1 [(required) = true];

  // Name of the new Valkey cluster. The name must be unique within the folder.
  string name = 2 [
    (length) = "<=63",
    (pattern) = "[a-zA-Z0-9_-]*",
    (required) = true
  ];

  // Description of the new Valkey cluster.
  string description = 3 [(length) = "<=256"];

  // Custom labels for the Valkey cluster as `` key:value `` pairs. Maximum 64 per cluster.
  // For example, "project": "mvp" or "source": "dictionary".
  map<string, string> labels = 4 [
    (length) = "<=63",
    (map_key) = {
      length: "<=63"
      pattern: "[a-z][-_./\\@0-9a-z]*"
    },
    (pattern) = "[-_0-9a-z]*",
    (size) = "<=64"
  ];

  // Deployment environment of the new Valkey cluster.
  Cluster.Environment environment = 5 [(required) = true];

  // Configuration for the Valkey cluster to be created.
  ConfigSpec config_spec = 6 [(required) = true];

  // Configurations for Valkey hosts that should be created for
  // the cluster that is being created from the backup.
  // If left empty, the hosts are taken from the source cluster of the backup.
  repeated HostSpec host_specs = 7;

  // ID of the network to create the Valkey cluster in.
  string network_id = 8 [(length) = "<=150"];

  // ID of the folder to create the Valkey cluster in.
  string folder_id = 9 [(length) = "<=50"];

  // User security groups
  repeated string security_group_ids = 10;

  // TLS port and functionality on\off
  google.protobuf.BoolValue tls_enabled = 11;

  // Persistence mode
  Cluster.PersistenceMode persistence_mode = 12;

  // Deletion Protection inhibits deletion of the cluster
  bool deletion_protection = 13;

  // Enable FQDN instead of ip
  bool announce_hostnames = 14;

  // Window of maintenance operations.
  MaintenanceWindow maintenance_window = 15 [deprecated = true];

  // Allows to use ACL users to auth in sentinel
  bool auth_sentinel = 16;

  // Valkey cluster mode on/off.
  bool sharded = 17;

  // ID of the key to encrypt cluster disks.
  google.protobuf.StringValue disk_encryption_key_id = 18 [(pattern) = "[a-zA-Z0-9_.-]{0,50}"];

  // Descriptions of users to be created in the Valkey cluster.
  repeated UserSpec user_specs = 19 [(size) = ">=0"];
}

message RestoreClusterMetadata {
  // ID of the new Valkey cluster that is being created from a backup.
  string cluster_id = 1;

  // ID of the backup that is being used for creating a cluster.
  string backup_id = 2;
}

message RescheduleMaintenanceRequest {
  // ID of the Valkey cluster to reschedule the maintenance operation for.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
  enum RescheduleType {
    RESCHEDULE_TYPE_UNSPECIFIED = 0;

    // Start the maintenance operation immediately.
    IMMEDIATE = 1;

    // Start the maintenance operation within the next available maintenance window.
    NEXT_AVAILABLE_WINDOW = 2;

    // Start the maintenance operation at the specific time.
    SPECIFIC_TIME = 3;
  }

  // The type of reschedule request.
  RescheduleType reschedule_type = 2 [(required) = true];

  // The time until which this maintenance operation should be delayed. The value should be ahead of the first time when the maintenance operation has been scheduled for no more than two weeks. The value can also point to the past moment of time if [reschedule_type.IMMEDIATE] reschedule type is chosen.
  google.protobuf.Timestamp delayed_until = 3;
}

message RescheduleMaintenanceMetadata {
  reserved 2 to 3;

  // ID of the Valkey cluster.
  string cluster_id = 1;

  // The time until which this maintenance operation is to be delayed.
  google.protobuf.Timestamp delayed_until = 4;
}

message StartClusterFailoverRequest {
  // ID of the Valkey cluster to start failover on.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // List of hostnames. Can be empty for sentinel clusters or can contain multiple hosts for sharded clusters.
  repeated string host_names = 2 [(length) = "<=253"];
  enum FailoverType {
    FAILOVER_TYPE_UNSPECIFIED = 0;

    // Switch master role to hosts identified by the provided hostnames.
    SWITCH_TO_HOSTNAMES = 1;

    // Switch master role away from hosts identified by the provided hostnames.
    SWITCH_FROM_HOSTNAMES = 2;

    // Switch master role away from the specified availability zone.
    SWITCH_FROM_ZONE = 3;
  }

  // The type of failover request.
  FailoverType failover_type = 3;

  // ZoneID to switch hosts from.
  string zone_id = 4;
}

message StartClusterFailoverMetadata {
  // ID of the Valkey cluster on which failover will be initiated.
  string cluster_id = 1;

  // List of hostnames which should not be masters. Can be empty for sentinel clusters or can contain multiple hosts for sharded clusters.
  repeated string host_names = 2;

  // The ID of the availability zone failover hosts from.
  string zone_id = 3;
}

message LogRecord {
  // Log record timestamp in [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
  google.protobuf.Timestamp timestamp = 1;

  // Contents of the log record.
