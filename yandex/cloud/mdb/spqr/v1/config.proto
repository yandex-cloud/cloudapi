syntax = "proto3";

package yandex.cloud.mdb.spqr.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/mdb/spqr/v1;spqr";
option java_package = "yandex.cloud.api.mdb.spqr.v1";

message MDBPostgreSQL {
  // ID of the Managed PostgreSQL cluster
  string cluster_id = 1 [(required) = true];
}

enum LogLevel {
  reserved 6;

  LOG_LEVEL_UNSPECIFIED = 0;

  // Provides diagnostic information for developers.
  DEBUG = 1;

  // Reports information implicitly requested by the user.
  INFO = 2;

  // Reports a warning about a likely problem.
  WARNING = 3;

  // Reports an error that aborts the current command.
  ERROR = 4;

  // Reports an error that aborts the current session.
  FATAL = 5;
}

message SPQRConfig {
  reserved 4;

  // SPQR router settings.
  RouterConfig router = 1;

  // SPQR coordinator settings.
  CoordinatorConfig coordinator = 2;

  // PostgreSQL settings.
  PostgreSQLConfig postgresql = 3;

  // SPQR Infra (router+coordinator) settings.
  InfraConfig infra = 5;

  // SPQR Balancer settings.
  BalancerSettings balancer = 7;

  // SPQR default log level
  LogLevel log_level = 6;

  // Tells SPQR to use spqrguard extension. Extension must be enabled on shards.
  //
  // For details, see [documentation](https://github.com/pg-sharding/spqr/blob/master/docs/deployment/spqrguard.mdx)
  google.protobuf.BoolValue use_spqrguard = 8;
  google.protobuf.BoolValue forbid_direct_shard_queries = 9;
}

message RouterConfig {
  // Configuration for router hosts.
  RouterSettings config = 1;

  // Resources allocated to router hosts.
  Resources resources = 2;
}

message CoordinatorConfig {
  // Configuration for coordinator hosts.
  CoordinatorSettings config = 1;

  // Resources allocated to coordinator hosts.
  Resources resources = 2;
}

message PostgreSQLConfig {
  // Configuration for PostgreSQL hosts.
  PostgreSQLSettings config = 1;

  // Resources allocated to PostgreSQL hosts.
  Resources resources = 2;
}

message InfraConfig {
  reserved 1;

  // Resources allocated to infra hosts.
  Resources resources = 2;

  // Configuration for router.
  RouterSettings router = 3;

  // Configuration for coordinator.
  CoordinatorSettings coordinator = 4;
}

message BalancerSettings {
  google.protobuf.DoubleValue cpu_threshold = 1;
  google.protobuf.DoubleValue space_threshold = 2;
  google.protobuf.Int64Value stat_interval_sec = 3;
  google.protobuf.Int64Value max_move_count = 4;
  google.protobuf.Int64Value keys_per_move = 5;
  google.protobuf.Int64Value timeout = 6;
}

// Configuration of a SPQR router.
message RouterSettings {
  reserved 3;

  enum DefaultRouteBehavior {
    DEFAULT_ROUTE_BEHAVIOR_UNSPECIFIED = 0;
    BLOCK = 1;
    ALLOW = 2;
  }

  enum TargetSessionAttrs {
    TARGET_SESSION_ATTRS_UNSPECIFIED = 0;
    READ_WRITE = 1;
    SMART_READ_WRITE = 2;
    READ_ONLY = 3;
    PREFER_STANDBY = 4;
    ANY = 5;
  }

  enum CommitStrategy {
    COMMIT_STRATEGY_UNSPECIFIED = 0;
    BEST_EFFORT = 1;
    ONE_PC = 2;
    TWO_PC = 3;
  }

  // Enables notice messages.
  google.protobuf.BoolValue show_notice_messages = 1;

  // Time quantiles for query execution statistics.
  repeated double time_quantiles = 2;

  // Sets mode for multishard queries.
  DefaultRouteBehavior default_route_behavior = 4;

  // Prefers hosts in the same availability zone.
  google.protobuf.BoolValue prefer_same_availability_zone = 5;

  // Enables engine V2 with enhanced multishard query processing,
  google.protobuf.BoolValue enhanced_multishard_processing = 6;

  // Default [target_session_attrs](https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNECT-TARGET-SESSION-ATTRS) for connections.
  TargetSessionAttrs default_target_session_attrs = 7;

  // Default commit strategy for distributed transactions
  CommitStrategy default_commit_strategy = 8;

  // Enables postprocessing for multishard queries.
  google.protobuf.BoolValue allow_postprocessing = 9;

  // Whether to automatically route read-only queries to standby hosts.
  google.protobuf.BoolValue auto_route_ro_on_standby = 10;

  // Enables two-phase commit for modifying reference relations.
  google.protobuf.BoolValue allow_two_phase_commit = 11;
  google.protobuf.BoolValue allow_autoprotect_two_phase = 12;
}

// Configuration of a SPQR coordinator.
message CoordinatorSettings {
  // Sleep duration between routers sync iterations.
  google.protobuf.Duration iteration_timeout = 1;

  // Sleep duration between attempts to acquire the coordinator lock when starting up.
  google.protobuf.Duration lock_iteration_timeout = 2;

  // Interval for sending gRPC keepalive pings to routers.
  google.protobuf.Duration router_keepalive_time = 3;

  // Time to wait for keepalive ping response before considering connection dead.
  google.protobuf.Duration router_keepalive_timeout = 4;

  // Maximum request size in bytes that the etcd client (QDB implementation) is allowed to send.
  google.protobuf.Int64Value etcd_max_send_bytes = 5;

  // Maximum number of subcommands allowed in a single etcd transaction.
  google.protobuf.Int64Value etcd_max_txn_ops = 6;
}

// Configuration of a PostgreSQL.
message PostgreSQLSettings {
}

message Resources {
  // ID of the preset for computational resources available to a host (CPU, memory etc.).
  // All available presets are listed in the [documentation](/docs/managed-spqr/concepts/instance-types).
  string resource_preset_id = 1;

  // Volume of the storage available to a host, in bytes.
  int64 disk_size = 2;

  // Type of the storage environment for the host.
  // Possible values:
  // * network-hdd - network HDD drive,
  // * network-ssd - network SSD drive,
  // * local-ssd - local SSD storage.
  string disk_type_id = 3;
}
