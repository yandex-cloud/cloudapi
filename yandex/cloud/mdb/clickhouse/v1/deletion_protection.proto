syntax = "proto3";

package yandex.cloud.mdb.clickhouse.v1;

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/mdb/clickhouse/v1;clickhouse";
option java_package = "yandex.cloud.api.mdb.clickhouse.v1";

enum DeletionProtectionMode {
  // Deletion protection mode is not specified. Treated as `DELETION_PROTECTION_MODE_INHERITED`.
  DELETION_PROTECTION_MODE_UNSPECIFIED = 0;

  // Deletion protection is disabled.
  DELETION_PROTECTION_MODE_DISABLED = 1;

  // Deletion protection is enabled.
  DELETION_PROTECTION_MODE_ENABLED = 2;

  // Deletion protection mode is inherited from the cluster.
  DELETION_PROTECTION_MODE_INHERITED = 3;
}
