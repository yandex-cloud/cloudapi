syntax = "proto3";

package yandex.cloud.mdb.opensearch.v1;

import "google/api/annotations.proto";
import "yandex/cloud/mdb/opensearch/v1/user.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/mdb/opensearch/v1;opensearch";
option java_package = "yandex.cloud.api.mdb.opensearch.v1";

// A set of methods for retrieving OpenSearch users.
service UserService {
  // Returns the specified OpenSearch user.
  rpc Get(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/managed-opensearch/v1/clusters/{cluster_id}/users/{user_name}"
    };
  };

  // Returns the list of users for the specified OpenSearch cluster.
  rpc List(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/managed-opensearch/v1/clusters/{cluster_id}/users"
    };
  };
}

message GetUserRequest {
  // Required. ID of the OpenSearch cluster.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Required. Name of the user to return.
  string user_name = 2 [
    (length) = "<=63",
    (pattern) = "[a-zA-Z0-9_]*",
    (required) = true
  ];
}

message ListUsersRequest {
  // Required. ID of the OpenSearch cluster.
  string cluster_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // The maximum number of results per page to return.
  int64 page_size = 2 [(value) = "0-1000"];

  // Page token. Set it to the `next_page_token` returned by a previous request.
  string page_token = 3 [(length) = "<=100"];
}

message ListUsersResponse {
  // Requested list of OpenSearch users.
  repeated User users = 1;

  // Token for getting the next page of results.
  string next_page_token = 2;
}
