syntax = "proto3";

package yandex.cloud.mdb.opensearch.v1;

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/mdb/opensearch/v1;opensearch";
option java_package = "yandex.cloud.api.mdb.opensearch.v1";

// An OpenSearch user.
message User {
  // Name of the user.
  string name = 1;

  // Connection Manager connection associated with the user. Read only field.
  ConnectionManager connection_manager = 2;
}

message ConnectionManager {
  // ID of the Connection Manager connection.
  string connection_id = 1;
}
