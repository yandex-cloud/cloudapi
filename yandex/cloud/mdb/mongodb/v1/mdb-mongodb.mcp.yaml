services:
  - name: BackupService
    tools:
      - method: Get
      - method: List
      - method: Delete
        disabled: true

  - name: ClusterService
    tools:
      - method: Get
      - method: List
      - method: Create
        tags: ["sensitive"]
        input:
          - field: config_spec
            inner:
              - field: mongodb_spec_3_6
                disabled: true
              - field: mongodb_spec_4_0
                disabled: true
              - field: mongodb_spec_4_2
                disabled: true
              - field: mongodb_spec_4_4
                disabled: true
              - field: mongodb_spec_4_4_enterprise
                disabled: true
              - field: mongodb_spec_5_0
                disabled: true
              - field: mongodb_spec_5_0_enterprise
                disabled: true
              - field: mongodb_spec_6_0
                disabled: true
              - field: mongodb_spec_6_0_enterprise
                disabled: true
              - field: mongodb
                inner:
                  - field: mongoinfra
                    inner:
                      - field: config_mongos
                        disabled: true
                      - field: config_mongocfg
                        disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: Update
        tags: ["sensitive"]
        input:
          - field: config_spec
            inner:
              - field: mongodb_spec_3_6
                disabled: true
              - field: mongodb_spec_4_0
                disabled: true
              - field: mongodb_spec_4_2
                disabled: true
              - field: mongodb_spec_4_4
                disabled: true
              - field: mongodb_spec_4_4_enterprise
                disabled: true
              - field: mongodb_spec_5_0
                disabled: true
              - field: mongodb_spec_5_0_enterprise
                disabled: true
              - field: mongodb_spec_6_0
                disabled: true
              - field: mongodb_spec_6_0_enterprise
                disabled: true
              - field: mongodb
                inner:
                  - field: mongoinfra
                    inner:
                      - field: config_mongos
                        disabled: true
                      - field: config_mongocfg
                        disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: Delete
        disabled: true
      - method: Start
      - method: Stop
      - method: Move
      - method: Backup
      - method: Restore
        tags: ["sensitive"]
        input:
          - field: config_spec
            inner:
              - field: mongodb_spec_3_6
                disabled: true
              - field: mongodb_spec_4_0
                disabled: true
              - field: mongodb_spec_4_2
                disabled: true
              - field: mongodb_spec_4_4
                disabled: true
              - field: mongodb_spec_4_4_enterprise
                disabled: true
              - field: mongodb_spec_5_0
                disabled: true
              - field: mongodb_spec_5_0_enterprise
                disabled: true
              - field: mongodb_spec_6_0
                disabled: true
              - field: mongodb_spec_6_0_enterprise
                disabled: true
              - field: mongodb
                inner:
                  - field: mongoinfra
                    inner:
                      - field: config_mongos
                        disabled: true
                      - field: config_mongocfg
                        disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: RescheduleMaintenance
      - method: ListLogs
      - method: StreamLogs
      - method: ListOperations
      - method: ListBackups
      - method: ListHosts
      - method: AddHosts
      - method: DeleteHosts
        disabled: true
      - method: UpdateHosts
      - method: EnableSharding
      - method: GetShard
      - method: ListShards
      - method: AddShard
      - method: DeleteShard
        disabled: true
      - method: ResetupHosts
      - method: RestartHosts
      - method: StepdownHosts
      - method: ListAccessBindings
      - method: SetAccessBindings
        disabled: true
      - method: UpdateAccessBindings

  - name: DatabaseService
    tools:
      - method: Get
      - method: List
      - method: Create
      - method: Delete
        disabled: true

  - name: ResourcePresetService
    tools:
      - method: Get
      - method: List

  - name: UserService
    tools:
      - method: Get
      - method: List
      - method: Create
        tags: ["sensitive"]
      - method: Update
        tags: ["sensitive"]
      - method: Delete
        disabled: true
      - method: GrantPermission
      - method: RevokePermission
