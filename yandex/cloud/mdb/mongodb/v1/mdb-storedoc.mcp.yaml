services:
  - name: BackupService
    tools:
      - method: Get
      - method: List
      - method: Delete
        disabled: true

  - name: ClusterService
    tools:
      - method: Get
      - method: List
      - method: Create
        wait: false
        input:
          - field: maintenance_window # Deprecated in favor of maintenance_windows (plural).
            disabled: true
          - field: config_spec
            inner:
              - field: mongodb_spec_3_6
                disabled: true
              - field: mongodb_spec_4_0
                disabled: true
              - field: mongodb_spec_4_2
                disabled: true
              - field: mongodb_spec_4_4
                disabled: true
              - field: mongodb_spec_4_4_enterprise
                disabled: true
              - field: mongodb_spec_5_0
                disabled: true
              - field: mongodb_spec_5_0_enterprise
                disabled: true
              - field: mongodb_spec_6_0
                disabled: true
              - field: mongodb_spec_6_0_enterprise
                disabled: true
              - field: mongodb
                inner:
                  - field: mongoinfra
                    inner:
                      - field: config_mongos
                        disabled: true
                      - field: config_mongocfg
                        disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: Update
        wait: false
        input:
          - field: maintenance_window # Deprecated in favor of maintenance_windows (plural).
            disabled: true
          - field: config_spec
            inner:
              - field: mongodb_spec_3_6
                disabled: true
              - field: mongodb_spec_4_0
                disabled: true
              - field: mongodb_spec_4_2
                disabled: true
              - field: mongodb_spec_4_4
                disabled: true
              - field: mongodb_spec_4_4_enterprise
                disabled: true
              - field: mongodb_spec_5_0
                disabled: true
              - field: mongodb_spec_5_0_enterprise
                disabled: true
              - field: mongodb_spec_6_0
                disabled: true
              - field: mongodb_spec_6_0_enterprise
                disabled: true
              - field: mongodb
                inner:
                  - field: mongoinfra
                    inner:
                      - field: config_mongos
                        disabled: true
                      - field: config_mongocfg
                        disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
          - field: deletion_protection
            disabled: true
      - method: Delete
        disabled: true
      - method: Start
        wait: false
      - method: Stop
        wait: false
      - method: Move
        wait: false
      - method: Backup
        wait: false
      - method: Restore
        wait: false
        input:
          - field: maintenance_window # Deprecated in favor of maintenance_windows (plural).
            disabled: true
          - field: config_spec
            inner:
              - field: mongodb_spec_3_6
                disabled: true
              - field: mongodb_spec_4_0
                disabled: true
              - field: mongodb_spec_4_2
                disabled: true
              - field: mongodb_spec_4_4
                disabled: true
              - field: mongodb_spec_4_4_enterprise
                disabled: true
              - field: mongodb_spec_5_0
                disabled: true
              - field: mongodb_spec_5_0_enterprise
                disabled: true
              - field: mongodb_spec_6_0
                disabled: true
              - field: mongodb_spec_6_0_enterprise
                disabled: true
              - field: mongodb
                inner:
                  - field: mongoinfra
                    inner:
                      - field: config_mongos
                        disabled: true
                      - field: config_mongocfg
                        disabled: true
              - field: backup_window_start
                inner:
                  - field: seconds
                    disabled: true
                  - field: nanos
                    disabled: true
      - method: RescheduleMaintenance
      - method: ListLogs
      - method: StreamLogs
        disabled: true
      - method: ListOperations
      - method: ListBackups
      - method: ListHosts
      - method: AddHosts
        wait: false
      - method: DeleteHosts
        disabled: true
      - method: UpdateHosts
        wait: false
      - method: EnableSharding
        wait: false
      - method: GetShard
      - method: ListShards
      - method: AddShard
        wait: false
      - method: DeleteShard
        disabled: true
      - method: ResetupHosts
        wait: false
      - method: RestartHosts
        wait: false
      - method: StepdownHosts
      - method: ListAccessBindings
      - method: SetAccessBindings
        disabled: true
      - method: UpdateAccessBindings

  - name: DatabaseService
    tools:
      - method: Get
      - method: List
      - method: Create
        wait: false
      - method: Delete
        wait: false
        disabled: true

  - name: ResourcePresetService
    tools:
      - method: Get
        description: >-
          Returns one preset: zone_ids, memory, cores. Use it to validate a preset the user named
          instead of listing all of them.
      - method: List

  - name: UserService
    tools:
      - method: Get
      - method: List
      - method: Create
        wait: false
      - method: Update
        wait: false
        input:
          - field: deletion_protection
            disabled: true
      - method: Delete
        disabled: true
      - method: GrantPermission
        wait: false
      - method: RevokePermission
        wait: false

  - name: VersionsService
    tools:
      - method: List
        description: >-
          Lists the StoreDoc (MongoDB) versions that can actually be used, and the upgrade path
          between them. Call this before ClusterServiceCreate and before any version change
          instead of guessing. Each entry has id (the exact string for configSpec.version),
          status, deprecated_at and updatable_to — every version in updatable_to is a valid
          target for a single ClusterServiceUpdate.
        input:
          - field: page_size
            disabled: true
          - field: page_token
            disabled: true
