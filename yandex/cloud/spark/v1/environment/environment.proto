syntax = "proto3";

package yandex.cloud.spark.v1.environment;

import "google/protobuf/timestamp.proto";
import "yandex/cloud/spark/v1/environment/enum.proto";
import "yandex/cloud/spark/v1/environment/spark_config.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/spark/v1/environment;spark_environment";
option java_package = "yandex.cloud.api.spark.v1.environment";

// Environment Build Error.
message BuildError {
  // Error Type.
  string type = 1 [(length) = "<=100"];

  // Error Message.
  string message = 2 [(length) = "<=2000"];
}

// Environment Info.
message EnvironmentInfo {
  reserved 11;

  // Unique ID of the Environment. This ID is assigned in the process of creating an Environment.
  string id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Environment life stage.
  EnvironmentLifeStage life_stage = 2;

  // Name of the Environment. The name of the user environment is unique within the folder. 1-63 characters long.
  string name = 3 [
    (length) = "<=63",
    (pattern) = "^[a-z][-a-z0-9]{1,61}[a-z0-9]$",
    (required) = true
  ];

  // Description of the Environment. 0-256 characters long.
  string description = 4;

  // Environment labels.
  map<string, string> labels = 5 [
    (length) = "<=63",
    (map_key) = {
      length: "1-63"
      pattern: "[a-z][-_0-9a-z]*"
    },
    (pattern) = "[-_0-9a-z]*",
    (size) = "<=64"
  ];

  // The time when the Environment was created.
  google.protobuf.Timestamp created_at = 6;

  // The time when the Environment was deleted.
  google.protobuf.Timestamp deleted_at = 7;

  // Actual build revision number.
  int64 build_revision = 8 [(value) = ">0"];

  // Base environment actual build revision number.
  int64 build_base_revision = 9;

  // Actual build status.
  BuildStatus build_status = 10;

  // Actual build creation error.
  BuildError build_error = 12;

  // The time when the actual build was created.
  google.protobuf.Timestamp build_created_at = 13;

  // The time when the actual build was deleted.
  google.protobuf.Timestamp build_deleted_at = 14;
}

// Environment.
message Environment {
  // Environment info.
  EnvironmentInfo info = 1 [(required) = true];

  // Base Environment info.
  EnvironmentInfo base_info = 2 [(required) = true];

  // ID of the folder that Environment belongs to.
  string folder_id = 3;

  // Environment Configuration.
  EnvironmentConfig config = 4;
}

// Base Environment.
message BaseEnvironment {
  // Base Environment info.
  EnvironmentInfo info = 1 [(required) = true];

  // Base Environment Configuration.
  BaseEnvironmentConfig config = 2 [(required) = true];
}
