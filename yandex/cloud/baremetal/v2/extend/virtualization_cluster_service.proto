syntax = "proto3";

package yandex.cloud.baremetal.v2.extend;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "yandex/cloud/api/operation.proto";
import "yandex/cloud/baremetal/v2/extend/virtualization_cluster.proto";
import "yandex/cloud/baremetal/v2/operation.proto";
import "yandex/cloud/operation/operation.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/baremetal/v2/extend;baremetal";
option java_package = "yandex.cloud.api.api.baremetal.v2.extend";

service VirtualizationClusterService {
  // Returns the specified Virtualization cluster.
  // (-- api-linter: yc::1702::method-no-resource=disabled --)
  rpc GetVirtualizationCluster(GetVirtualizationClusterRequest) returns (VirtualizationCluster) {
    option (google.api.http) = {
      get: "/v2/clouds/{cloud_id}/folders/{folder_id}/extend/virtualizationClusters/{virtualization_cluster_id}"
    };
    option (google.api.method_signature) = "cloud_id,folder_id,virtualization_cluster_id";
  };

  // Lists Virtualization clusters in the specified folder.
  // (-- api-linter: yc::1702::method-no-resource=disabled --)
  rpc ListVirtualizationClusters(ListVirtualizationClustersRequest) returns (ListVirtualizationClustersResponse) {
    option (google.api.http) = {
      get: "/v2/clouds/{cloud_id}/folders/{folder_id}/extend/virtualizationClusters"
    };
    option (google.api.method_signature) = "cloud_id,folder_id";
  };

  // Updates the specified Virtualization cluster.
  // (-- api-linter: yc::1702::method-no-resource=disabled --)
  rpc UpdateVirtualizationCluster(UpdateVirtualizationClusterRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "UpdateVirtualizationClusterMetadata"
      response: "VirtualizationCluster"
    };
    option (google.api.http) = {
      body: "cluster"
      patch: "/v2/clouds/{cluster.cloud_id}/folders/{cluster.folder_id}/extend/virtualizationClusters/{cluster.virtualization_cluster_id}"
    };
    option (google.api.method_signature) = "cluster,update_mask";
  };

  // Lists operations for the specified Virtualization cluster.
  // (-- api-linter: yc::1702::method-no-resource=disabled --)
  rpc ListVirtualizationClusterOperations(ListVirtualizationClusterOperationsRequest) returns (ListVirtualizationClusterOperationsResponse) {
    option (google.api.http) = {
      get: "/v2/clouds/{cloud_id}/folders/{folder_id}/extend/virtualizationClusters/{virtualization_cluster_id}/operations"
    };
    option (google.api.method_signature) = "cloud_id,folder_id,virtualization_cluster_id";
  };
}

message ListVirtualizationClusterOperationsRequest {
  // ID of the parent cloud.
  string cloud_id = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the parent folder.
  string folder_id = 2 [(google.api.field_behavior) = REQUIRED];

  // ID of the cluster to list operations for.
  string virtualization_cluster_id = 3 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of results per page to return. If the number of available
  // results is greater than `page_size`,
  // the service returns a [ListVirtualizationClusterOperationsResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests.
  // Default value is 20.
  int64 page_size = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (value) = "<=1000"
  ];

  // Page token. To get the next page of results, set `page_token` to the
  // [ListVirtualizationClusterOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListVirtualizationClusterOperationsResponse {
  // List of operations for the specified Virtualization cluster.
  repeated operation.Operation operations = 1;

  // Token for getting the next page of the list. If the number of results is greater than
  // [ListVirtualizationClusterOperationsRequest.page_size], use `next_page_token` as the value
  // for the [ListVirtualizationClusterOperationsRequest.page_token] parameter in the next list request.
  // Each subsequent page will have its own `next_page_token` to continue paging through the results.
  string next_page_token = 2;
}

message GetVirtualizationClusterRequest {
  // ID of the parent cloud.
  string cloud_id = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the parent folder.
  string folder_id = 2 [(google.api.field_behavior) = REQUIRED];

  // ID of the cluster to retrieve.
  string virtualization_cluster_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message ListVirtualizationClustersRequest {
  // ID of the parent cloud.
  //
  // To get the cloud ID, use a [yandex.cloud.resourcemanager.v1.CloudService.List] request.
  string cloud_id = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the parent folder.
  //
  // To get the folder ID, use a [yandex.cloud.resourcemanager.v1.FolderService.List] request.
  string folder_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of results per page to return. If the number of available
  // results is greater than `page_size`,
  // the service returns a [ListVirtualizationClustersResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests.
  // Default value is 20.
  int64 page_size = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (value) = "<=1000"
  ];

  // Page token. To get the next page of results, set `page_token` to the
  // [ListVirtualizationClustersResponse.next_page_token] returned by a previous list request.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];

  // By which column the listing should be ordered and in which direction.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // A filter expression that filters resources listed in the response.
  string filter = 6 [(google.api.field_behavior) = OPTIONAL];
}

message ListVirtualizationClustersResponse {
  reserved 2 to 99;

  // List of Cluster resources.
  repeated VirtualizationCluster clusters = 1;

  // Token for getting the next page of the list. If the number of results is greater than
  // [ListVirtualizationClustersRequest.page_size], use `next_page_token` as the value
  // for the [ListVirtualizationClustersRequest.page_token] parameter in the next list request.
  //
  // Each subsequent page will have its own `next_page_token` to continue paging through the results.
  string next_page_token = 100;
}

message UpdateVirtualizationClusterRequest {
  // The cluster object to be updated
  VirtualizationCluster cluster = 1 [(google.api.field_behavior) = REQUIRED];

  // Field mask that specifies which fields of the VirtualizationCluster resource are going to be updated.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateVirtualizationClusterMetadata {
  // ID of the VirtualizationCluster resource that is being updated.
  string virtualization_cluster_id = 1;

  // Common operation metadata
  OperationMetadata operation_metadata = 2;
}
