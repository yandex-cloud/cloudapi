syntax = "proto3";

package yandex.cloud.baremetal.v2.extend;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "yandex/cloud/baremetal/v2/extend/cluster.proto";
import "yandex/cloud/baremetal/v2/extend/nodes.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/baremetal/v2/extend;baremetal";
option java_package = "yandex.cloud.api.api.baremetal.v2.extend";

message VirtualizationCluster {
  // ID of the cluster.
  string virtualization_cluster_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // ID of the cloud that the cluster belongs to.
  string cloud_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // ID of the folder that the cluster belongs to.
  string folder_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Name of the cluster.
  // The display name is unique within the folder.
  string name = 4 [(google.api.field_behavior) = REQUIRED];

  // Description of the cluster.
  string description = 5 [(google.api.field_behavior) = OPTIONAL];
  enum State {
    // Unspecified cluster state.
    STATE_UNSPECIFIED = 0;

    // Cluster is awaiting user acceptance.
    OFFERRING = 1;

    // Cluster is being created.
    CREATING = 2;

    // Cluster is being updated.
    UPDATING = 3;

    // Cluster is running.
    RUNNING = 4;

    // Cluster is being deleted.
    DELETING = 5;

    // Cluster is in error state.
    ERROR = 6;
  }

  // State of the cluster.
  State state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Update timestamp.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Resource labels as `key:value` pairs.
  map<string, string> annotations = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (length) = "<=63",
    (map_key) = {
      length: "1-63"
      pattern: "[a-z][-_0-9a-z]*"
    },
    (pattern) = "[-_0-9a-z]*",
    (size) = "<=64"
  ];

  // ID of the hardware pool that the cluster belongs to.
  string hardware_pool_id = 10 [(google.api.field_behavior) = REQUIRED];

  // Which node types are to be used for cluster roles.
  VirtualizationHostRoles host_roles = 11 [(google.api.field_behavior) = REQUIRED];

  // Bastion node.
  Node bastion = 12 [(google.api.field_behavior) = OPTIONAL];

  // IDs of subnets used for VMs. Should be defined before cluster creation.
  repeated string vm_subnet_ids = 13 [(google.api.field_behavior) = OPTIONAL];

  // Subnet used for management.
  string management_subnet_id = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Subnet used for migration traffic.
  string migration_subnet_id = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Subnet used for storage traffic.
  string storage_subnet_id = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Secret containing passwords for cluster.
  string admin_credentials_lockbox_secret_id = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Management IP address used for the cluster control endpoint.
  string management_ip_address = 18 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Base cluster DNS domain.
  string cluster_domain = 19 [(google.api.field_behavior) = OPTIONAL];

  // Billing status of the cluster's software licence consumption.
  BillingStatus billing_status = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message VirtualizationHostRoles {
  reserved 2;

  // Node types used as compute standard ready nodes.
  repeated NodeGroup compute = 1 [(google.api.field_behavior) = OPTIONAL];

  // Node types used as storage standard ready nodes.
  repeated NodeGroup storage = 3 [(google.api.field_behavior) = OPTIONAL];
}
