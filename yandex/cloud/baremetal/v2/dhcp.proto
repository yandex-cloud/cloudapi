syntax = "proto3";

package yandex.cloud.baremetal.v2;

import "google/api/field_behavior.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/baremetal/v2;baremetal";
option java_package = "yandex.cloud.api.api.baremetal.v2";

// DHCP options for a subnet.
message DhcpOptions {
  // Start IP address of the DHCP range (inclusive).
  // The absence or null value indicates that calculation will be performed based on CIDR.
  string start_ip = 1 [(google.api.field_behavior) = OPTIONAL];

  // End IP address of the DHCP range (inclusive).
  // The absence or null value indicates that calculation will be performed based on CIDR.
  string end_ip = 2 [(google.api.field_behavior) = OPTIONAL];

  // DNS configuration handed out to servers via DHCP.
  DnsOptions dns_options = 3 [(google.api.field_behavior) = OPTIONAL];
}

// DNS configuration distributed through DHCP.
message DnsOptions {
  // DNS servers handed out to servers via DHCP option 6.
  // The order is preserved.
  repeated DnsServer servers = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (size) = "<=3"
  ];

  // DNS Domain name handed out to servers via DHCP options 15 and 119.
  string domain_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (length) = "<=253",
    (pattern) = "([a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?([.][a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?)*)|"
  ];
}

// Represents a DNS server specified either by an IP address or by a Cloud DNS inbound endpoint.
message DnsServer {
  oneof server {
    option (exactly_one) = true;

    // Manual DNS server IP address.
    string ip_address = 1 [
      (google.api.field_behavior) = OPTIONAL,
      (length) = "<=15",
      (pattern) = "(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])(?:[.](?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])){3}"
    ];

    // ID of the Cloud DNS inbound endpoint.
    string dns_inbound_endpoint_id = 2 [
      (google.api.field_behavior) = OPTIONAL,
      (length) = "20",
      (pattern) = "[a-z][a-z0-9]*"
    ];
  }
}
