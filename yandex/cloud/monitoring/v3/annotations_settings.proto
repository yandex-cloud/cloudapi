syntax = "proto3";

package yandex.cloud.monitoring.v3;

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/monitoring/v3;monitoring";
option java_package = "yandex.cloud.api.monitoring.v3";

// Configures the initial visibility of annotations on charts.
message AnnotationsSettings {
  // Specifies whether annotation lines and ranges are visible when the dashboard is opened.
  // Defaults to `false` when omitted.
  bool visible = 1;
}
