syntax = "proto3";

package yandex.cloud.monitoring.v3;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "yandex/cloud/api/operation.proto";
import "yandex/cloud/monitoring/v3/dashboard.proto";
import "yandex/cloud/monitoring/v3/link_item.proto";
import "yandex/cloud/monitoring/v3/parametrization.proto";
import "yandex/cloud/monitoring/v3/preset_item.proto";
import "yandex/cloud/monitoring/v3/timeline.proto";
import "yandex/cloud/monitoring/v3/widget.proto";
import "yandex/cloud/operation/operation.proto";
import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/monitoring/v3;monitoring";
option java_package = "yandex.cloud.api.monitoring.v3";

// A set of methods for managing dashboards.
service DashboardService {
  // Returns the specified dashboard.
  rpc Get(GetDashboardRequest) returns (Dashboard) {
    option (google.api.http) = {
      get: "/monitoring/v3/dashboards/{dashboard_id}"
    };
  };

  // Retrieves the list of dashboards in the specified folder.
  rpc List(ListDashboardsRequest) returns (ListDashboardsResponse) {
    option (google.api.http) = {
      get: "/monitoring/v3/dashboards"
    };
  };

  // Creates a new dashboard in the specified folder.
  rpc Create(CreateDashboardRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "CreateDashboardMetadata"
      response: "Dashboard"
    };
    option (google.api.http) = {
      body: "*"
      post: "/monitoring/v3/dashboards"
    };
  };

  // Updates the specified dashboard.
  rpc Update(UpdateDashboardRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "UpdateDashboardMetadata"
      response: "Dashboard"
    };
    option (google.api.http) = {
      body: "*"
      patch: "/monitoring/v3/dashboards/{dashboard_id}"
    };
  };

  // Deletes the specified dashboard.
  rpc Delete(DeleteDashboardRequest) returns (operation.Operation) {
    option (api.operation) = {
      metadata: "DeleteDashboardMetadata"
      response: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/monitoring/v3/dashboards/{dashboard_id}"
    };
  };

  // Lists operations for the specified dashboard.
  rpc ListOperations(ListDashboardOperationsRequest) returns (ListDashboardOperationsResponse) {
    option (google.api.http) = {
      get: "/monitoring/v3/dashboards/{dashboard_id}/operations"
    };
  };

  // (-- api-linter: yc::1702::method-verb-prefix=disabled
  // The method predates this rule; renaming a published rpc is a breaking change. --)
  // Converts a Grafana dashboard into a Monitoring dashboard draft.
  //
  // Nothing is persisted: the caller reviews the returned draft and the
  // diagnostics, then calls [DashboardService.Create] to materialize it.
  rpc ConvertFromGrafana(ConvertFromGrafanaRequest) returns (ConvertFromGrafanaResponse) {
    option (google.api.http) = {
      body: "*"
      post: "/monitoring/v3/dashboards:convertFromGrafana"
    };
  };
}

message GetDashboardRequest {
  // Required. Dashboard ID.
  string dashboard_id = 1 [
    (length) = "<=50",
    (required) = true
  ];
}

message ListDashboardsRequest {
  reserved 1, 3 to 18;

  // Container id
  oneof container {

    // Required. Folder ID.
    string folder_id = 2;
  }

  // The maximum number of dashboards to return.
  // If unspecified, at most 100 dashboards will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int64 page_size = 19 [(value) = "<=1000"];

  // Page token. To get the next page of results, set `page_token` to the
  // [ListDashboardResponse.next_page_token] returned by a previous list request.
  string page_token = 20 [(length) = "<=100"];

  // Text substring to find in any of dashboard fields: id, name, etc
  // result will include dashboards that meet BOTH filter and selector (see below) criteria
  string filter = 21 [(length) = "<=1000"];

  // Selector string to match dashboard fields:
  // id, name, description, managed_by, etc, format: FIELDNAME PREDICATE VALUE, FIELDNAME PREDICATE VALUE, ...
  // and dashboard labels, format: labels.KEY PREDICATE VALUE, labels.KEY PREDICATE VALUE, ...
  // supports GLOB and regex expressions
  // dashboard must meet ALL tokens in selector string
  // example: name = "New", description = "*new*", labels.key != "bad"
  string selectors = 22 [(length) = "<=1000"];

  // Control which fields to include in dashboard response.
  google.protobuf.FieldMask read_mask = 23;
}

message ListDashboardsResponse {
  // List of dashboards.
  repeated Dashboard dashboards = 1;

  // Token to retrieve the next page of results, or empty if there are no more results in the list.
  string next_page_token = 2;
}

message CreateDashboardRequest {
  reserved 1, 3 to 18, 25, 30 to 33;

  // Container id
  oneof container {

    // Required. Folder ID.
    string folder_id = 2 [
      (length) = "<=50",
      (required) = true
    ];
  }

  // Required. Dashboard name.
  string name = 19;

  // Dashboard description.
  string description = 20;

  // Resource labels as `key:value` pairs.
  map<string, string> labels = 21 [
    (length) = "<=63",
    (map_key) = {
      length: "1-63"
      pattern: "[a-z][-_./\\@0-9a-z]*"
    },
    (size) = "<=64"
  ];

  // Dashboard title.
  string title = 22;

  // List of dashboard widgets.
  repeated Widget widgets = 23;

  // Dashboard parametrization.
  Parametrization parametrization = 24;

  // Entity that controls dashboard
  // Must match the regular expression "[\w \-]{1,100}"
  string managed_by = 26;

  // Information about entity that controls dashboard
  // Must be valid URI
  string managed_link = 27;

  // Refresh and time window settings
  Timeline timeline = 28;

  // Dashboard links
  repeated LinkItem links = 29;

  // Parameters / Infra events / Logs overlays presets list
  repeated PresetItem preset_items = 34;
}

message CreateDashboardMetadata {
  // Dashboard ID.
  string dashboard_id = 1;
}

message UpdateDashboardRequest {
  reserved 9 to 25, 30;

  // Required. Dashboard ID.
  string dashboard_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Required. Dashboard name.
  string name = 2;

  // Dashboard description.
  string description = 3;

  // Resource labels as `key:value` pairs.
  // Existing set of `labels` is completely replaced by the provided set.
  map<string, string> labels = 4 [
    (length) = "<=63",
    (map_key) = {
      length: "1-63"
      pattern: "[a-z][-_./\\@0-9a-z]*"
    },
    (size) = "<=64"
  ];

  // Dashboard title.
  string title = 5;

  // List of dashboard widgets.
  repeated Widget widgets = 6;

  // Dashboard parametrization.
  Parametrization parametrization = 7;

  // The current etag of the dashboard.
  string etag = 8;

  // Entity that controls dashboard
  // Must match the regular expression "[\w \-]{1,100}"
  string managed_by = 26;

  // Information about entity that controls dashboard
  // Must be valid URI
  string managed_link = 27;

  // Refresh and time window settings
  Timeline timeline = 28;

  // Dashboard links
  repeated LinkItem links = 29;

  // Comment, for update operation
  string comment = 31;

  // Parameters / Infra events / Logs overlays presets list
  repeated PresetItem preset_items = 32;
}

message UpdateDashboardMetadata {
  // Dashboard ID.
  string dashboard_id = 1;
}

message DeleteDashboardRequest {
  // Required. Dashboard ID.
  string dashboard_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // The current etag of the dashboard.
  string etag = 2;
}

message DeleteDashboardMetadata {
  // Dashboard ID.
  string dashboard_id = 1;
}

message ListDashboardOperationsRequest {
  // ID of the dashboard to list operations for.
  string dashboard_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // The maximum number of results per page to return. If the number of available
  // results is larger than [page_size], the service returns a [ListDashboardOperationsResponse.next_page_token]
  // that can be used to get the next page of results in subsequent list requests.
  int64 page_size = 2 [(value) = "<=1000"];

  // Page token. To get the next page of results, set [page_token] to the
  // [ListDashboardOperationsResponse.next_page_token] returned by a previous list request.
  string page_token = 3 [(length) = "<=100"];
}

message ListDashboardOperationsResponse {
  // List of operations for the specified dashboard.
  repeated operation.Operation operations = 1;

  // This token allows you to get the next page of results for list requests. If the number of results
  // is larger than [ListDashboardOperationsRequest.page_size], use the [next_page_token] as the value
  // for the [ListDashboardOperationsRequest.page_token] query parameter in the next list request.
  // Each subsequent list request will have its own [next_page_token] to continue paging through the results.
  string next_page_token = 2;
}

message ListDashboardLabelNamesRequest {
  // Project ID
  string project_id = 1;

  // Contains substring of name(aka key). All label names containing this string will be returned
  string text = 2;

  // Filters alerts by this selectors.
  string selectors = 3;

  // Page size
  int64 page_size = 4;
}

message ListDashboardLabelNamesResponse {
  // List of label names
  repeated string label_names = 1;

  // Is truncated
  bool truncated = 2;
}

message ListDashboardLabelValuesRequest {
  // Project ID
  string project_id = 1;

  // Filters alerts by this selectors.
  string selectors = 2;

  // Contains full name (aka key), for which existing values are gathered.
  string label_name = 3;

  // Contains substring of value. All label values containing this string will be returned
  string text = 4;

  // Page size
  int64 page_size = 5;
}

message ListDashboardLabelValuesResponse {
  // List of label values
  repeated string label_values = 1;

  // Is truncated
  bool truncated = 2;
}

// Strategy for translating PromQL (Prometheus data source) panel queries.
// Queries against the Monitoring data source are unaffected by this mode.
enum QueryTranslationMode {
  QUERY_TRANSLATION_MODE_UNSPECIFIED = 0;

  // Keep queries in PromQL for the native Prometheus data source, adapting
  // only Grafana template syntax (`$var`, `$__rate_interval`).
  QUERY_TRANSLATION_MODE_KEEP_PROMQL = 1;

  // Translate PromQL to the Monitoring query language where possible; an
  // untranslatable query is kept in PromQL and reported with a WARNING
  // diagnostic.
  QUERY_TRANSLATION_MODE_TRANSLATE_TO_SEL = 2;
}

// Strategy for widget types that have no direct Monitoring equivalent.
enum UnsupportedWidgetMode {
  UNSUPPORTED_WIDGET_MODE_UNSPECIFIED = 0;

  // Map to the closest supported widget type and emit an INFO diagnostic;
  // a type with no reasonable match becomes a text placeholder with
  // a WARNING diagnostic.
  UNSUPPORTED_WIDGET_MODE_CLOSEST_MATCH = 1;

  // Drop the widget and emit an ERROR diagnostic.
  UNSUPPORTED_WIDGET_MODE_SKIP = 2;
}

// Strategy for queries whose data source is not available in Monitoring
// (InfluxDB, Graphite, SQL, CloudWatch, ...).
enum UnavailableDataSourceMode {
  UNAVAILABLE_DATA_SOURCE_MODE_UNSPECIFIED = 0;

  // Keep such queries as is (only template variable syntax is adapted) and
  // report each with a WARNING diagnostic; the widget renders no data until
  // the query is rewritten.
  UNAVAILABLE_DATA_SOURCE_MODE_KEEP_QUERIES = 1;

  // Drop such queries; a widget left with no queries at all is dropped with
  // an ERROR diagnostic.
  UNAVAILABLE_DATA_SOURCE_MODE_DROP = 2;
}

// Tunable knobs for a dashboard conversion. Each dimension is independent;
// new dimensions are added as new fields without breaking existing callers.
// Widget layout is not configurable: positions are derived from the Grafana
// `gridPos` coordinates, rescaled to the Monitoring grid and regrouped by rows.
message ConversionOptions {
  // How to translate panel queries.
  // If unspecified, `QUERY_TRANSLATION_MODE_TRANSLATE_TO_SEL` is used.
  QueryTranslationMode query_translation = 1;

  // What to do with widget types Monitoring has no equivalent for.
  // If unspecified, `UNSUPPORTED_WIDGET_MODE_CLOSEST_MATCH` is used.
  UnsupportedWidgetMode unsupported_widget = 2;

  // Target Prometheus workspace for converted Prometheus queries.
  // When unset, the workspace in the draft is left empty and the caller must
  // fill it in before [DashboardService.Create].
  string prometheus_workspace_id = 3 [(length) = "<=50"];

  // Explicit metric renames applied during query translation, keyed by the
  // metric name exactly as written in the source PromQL. Applied before any
  // automatic name resolution and wins over it. Typical flow: the first
  // [DashboardService.ConvertFromGrafana] call reports `KIND_METRIC_NOT_FOUND`
  // and `KIND_METRIC_AUTO_RESOLVED` diagnostics with suggestions, the caller
  // reviews them and repeats the call with the chosen renames.
  map<string, string> metric_renames = 4 [
    (length) = "<=200",
    (size) = "<=1000"
  ];

  // What to do with queries whose data source is not available in Monitoring.
  // If unspecified, `UNAVAILABLE_DATA_SOURCE_MODE_KEEP_QUERIES` is used.
  UnavailableDataSourceMode unavailable_data_source = 5;

  // Optional coordinates of the shard the translated queries should read,
  // together with the project. They are also where the metric and label name
  // catalog is read from to reconcile Prometheus-style names against the names
  // actually stored (a Prometheus exporter and an OTLP push spell the same
  // metric differently). Either one unset means no catalog: translation still
  // happens, the selector keeps `*` in place of the missing coordinate, and
  // every metric and label name is carried over from the source PromQL exactly
  // as written.
  string cluster = 6 [(length) = "<=101"];

  // Service half of the shard coordinates; see cluster above.
  string service = 7 [(length) = "<=101"];

  // Optional label that holds the metric name in the target shard: "__name__" in a
  // Prometheus workspace, "sensor" on a migrated intranet shard, "name" on a cloud
  // one. Unset means the server takes it from the shard catalog, which is right
  // whenever the catalog is readable; set it when the catalog is unavailable or when
  // the shard carries several name-like labels and the wrong one would be picked:
  // with the wrong label the conversion succeeds and every widget renders empty.
  string metric_name_label = 8 [(length) = "<=101"];
}

message ConvertFromGrafanaRequest {
  // Required. Project ID the resulting draft belongs to.
  string project_id = 1 [
    (length) = "<=50",
    (required) = true
  ];

  // Required. Raw Grafana dashboard JSON (the dashboard "JSON model").
  string grafana_json = 2 [(required) = true];

  // Tunable conversion knobs. Omit for the defaults.
  ConversionOptions options = 3;
}

message ConvertFromGrafanaResponse {
  // Dashboard draft, ready to pass to [DashboardService.Create]. Nothing is
  // persisted by the conversion, so server-assigned fields (id, created_at,
  // modified_at, created_by, modified_by, etag) are empty.
  Dashboard dashboard = 1;

  // Per-element diagnostics: approximations, dropped panels, untranslated
  // queries, unsupported widget types, etc.
  repeated ConversionDiagnostic diagnostics = 2;
}

message ConversionDiagnostic {
  // Severity of a single conversion diagnostic.
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;

    // Benign approximation worth noting, e.g. a widget type substitution.
    SEVERITY_INFO = 1;

    // Best-effort fallback, e.g. a query kept in PromQL.
    SEVERITY_WARNING = 2;

    // Element could not be converted and was dropped.
    SEVERITY_ERROR = 3;
  }

  // Machine-readable category of a diagnostic. Lets the caller act on it
  // (build a metric mapping editor, group by cause) without parsing the
  // message text.
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // A query could not be translated (unsupported construct or data source);
    // it is kept in the source language or dropped with its widget.
    KIND_UNSUPPORTED_QUERY = 1;

    // The element converted with a known approximation - in the emitted query
    // or in the widget's visual features.
    KIND_APPROXIMATION = 2;

    // `subject` names a metric absent from the target container; `suggestions`
    // carry the closest existing names, possibly none.
    KIND_METRIC_NOT_FOUND = 3;

    // `subject` names a label key absent from the target container.
    KIND_LABEL_NOT_FOUND = 4;

    // `subject` was automatically resolved to an existing metric name
    // (case, separator and unit suffix reconciliation); `suggestions[0]` is
    // the applied name. Override via [ConversionOptions.metric_renames].
    KIND_METRIC_AUTO_RESOLVED = 5;

    // `subject` is a Prometheus recording rule (colon-form name); it never
    // exists in raw data - the rule must be recreated or its expression
    // inlined, a rename cannot fix it.
    KIND_RECORDING_RULE = 6;

    // `subject` is a Prometheus scrape meta-metric (`up`, `scrape_*`); it has
    // no equivalent in pushed data.
    KIND_SCRAPE_META_METRIC = 7;

    // `subject` contains an unexpanded template variable, so existence cannot
    // be verified.
    KIND_UNVERIFIED_NAME = 8;

    // A [ConversionOptions.metric_renames] entry points to a metric absent
    // from the container.
    KIND_RENAME_TARGET_NOT_FOUND = 9;

    // A [ConversionOptions.metric_renames] entry matched nothing in the
    // dashboard.
    KIND_RENAME_ENTRY_UNUSED = 10;

    // A widget type has no direct Monitoring equivalent (substituted or
    // dropped per [ConversionOptions.unsupported_widget]).
    KIND_UNSUPPORTED_WIDGET = 11;
  }

  // Severity of this diagnostic.
  Severity severity = 1;

  // Location in the source Grafana JSON, e.g. `panels[4].targets[0]`.
  string source_path = 2;

  // Title of the related panel or widget, when available.
  string widget_title = 3;

  // Human-readable explanation.
  string message = 4;

  // Machine-readable category of this diagnostic.
  Kind kind = 5;

  // The metric or label name this diagnostic is about, when the kind implies
  // one.
  string subject = 6;

  // Existing names from the target container offered as replacements for
  // `subject`, best match first. Feed the chosen one back via
  // [ConversionOptions.metric_renames].
  repeated string suggestions = 7;

  // Titles of all affected widgets when the diagnostic is aggregated
  // dashboard-wide (e.g. one `KIND_METRIC_NOT_FOUND` per missing metric);
  // `widget_title` and `source_path` may then be empty.
  repeated string affected_widgets = 8;
}
