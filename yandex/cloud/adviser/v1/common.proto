syntax = "proto3";

package yandex.cloud.adviser.v1;

import "yandex/cloud/validation.proto";

option go_package = "github.com/yandex-cloud/go-genproto/yandex/cloud/adviser/v1;adviser";
option java_package = "yandex.cloud.api.adviser.v1";

// State of the issue.
enum IssueState {
  ISSUE_STATE_UNSPECIFIED = 0;

  // The issue is detected on the resource and is not fixed yet.
  ISSUE_STATE_ACTIVE = 1;

  // The issue is not detected on the resource anymore.
  ISSUE_STATE_RESOLVED = 2;

  // The issue has not been confirmed for a long time, so it is considered outdated.
  ISSUE_STATE_STALED = 3;
}

// Severity of the issue.
enum IssueSeverity {
  ISSUE_SEVERITY_UNSPECIFIED = 0;

  // The issue is informational, no action is required.
  ISSUE_SEVERITY_INFO = 1;

  // The issue should be fixed, but it does not affect the resource right now.
  ISSUE_SEVERITY_WARNING = 2;

  // The issue affects the resource and should be fixed as soon as possible.
  ISSUE_SEVERITY_CRITICAL = 3;
}

// Category of the issue.
enum IssueCategory {
  ISSUE_CATEGORY_UNSPECIFIED = 0;

  // The issue is about the cost of the resource.
  ISSUE_CATEGORY_COST = 1;

  // The issue is about the performance of the resource.
  ISSUE_CATEGORY_PERFORMANCE = 2;

  // The issue is about the fault tolerance of the resource.
  ISSUE_CATEGORY_FAULT_TOLERANCE = 3;
}

// Visibility of the issue.
enum IssueVisibility {
  ISSUE_VISIBILITY_UNSPECIFIED = 0;

  // The issue is shown to the user.
  ISSUE_VISIBILITY_VISIBLE = 1;

  // The issue is dismissed by the user and is hidden until the dismissal expires.
  ISSUE_VISIBILITY_DISMISSED = 2;
}

// Type of the cloud resource that the issue is detected for.
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;

  // Managed Service for PostgreSQL cluster.
  RESOURCE_TYPE_MANAGED_POSTGRESQL = 1;

  // Managed Service for MySQL cluster.
  RESOURCE_TYPE_MANAGED_MYSQL = 2;

  // Managed Service for Redis cluster.
  RESOURCE_TYPE_MANAGED_REDIS = 3;

  // Managed Service for MongoDB cluster.
  RESOURCE_TYPE_MANAGED_MONGODB = 4;

  // Managed Service for ClickHouse cluster.
  RESOURCE_TYPE_MANAGED_CLICKHOUSE = 5;

  // Managed Service for Greenplum cluster.
  RESOURCE_TYPE_MANAGED_GREENPLUM = 6;

  // Managed Service for OpenSearch cluster.
  RESOURCE_TYPE_MANAGED_OPENSEARCH = 7;

  // Managed Service for SPQR cluster.
  RESOURCE_TYPE_MANAGED_SPQR = 8;
}

// Cloud resource that the issue is detected for.
message CloudResource {
  // Type of the resource.
  ResourceType type = 1 [(required) = true];

  // ID of the resource, e.g. ID of the Managed Service for PostgreSQL cluster.
  string resource_id = 2 [
    (length) = "<=50",
    (required) = true
  ];

  // ID of the folder that the resource belongs to.
  string folder_id = 3 [
    (length) = "<=50",
    (required) = true
  ];

  // ID of the cloud that the resource belongs to.
  string cloud_id = 4 [
    (length) = "<=50",
    (required) = true
  ];
}
