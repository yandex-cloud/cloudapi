include_protos:
  - yandex/cloud/serverless/apigateway/websocket/v1/connection_service.proto

services:
  - name: ApiGatewayService
    tools:
      - method: Get
      - method: List
      - method: Create
      - method: Update
      - method: Delete
      - method: AddDomain
      - method: RemoveDomain
      - method: GetOpenapiSpec
      - method: ListOperations
      - method: ListAccessBindings
      - method: SetAccessBindings
        disabled: true
      - method: UpdateAccessBindings

  - name: ConnectionService
    tools:
      - method: Get
      - method: Send
      - method: Disconnect
